<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作灵感 · Micheal 的拼豆网</title>
  <meta name="description" content="精选拼豆创作图纸库，涵盖热门动漫、名胜古建、治愈萌宠与节日美食，点击即可查看色号清单并带入创作工坊。" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="inspiration-container">
    <header class="page-head reveal">
      <span class="section-label">Inspiration</span>
      <h1>精选拼豆创作图纸库</h1>
      <p>收录 <strong id="gallery-count">—</strong> 款图纸，涵盖网络顶流、动漫 IP、游戏像素、人文建筑、治愈萌宠与节日美食。点击任意图纸即可查看色号清单，或直接带入创作工坊进行微调。</p>
    </header>

    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-category="all">全部</button>
      <button class="filter-tab" data-category="anime">🔥 热门动漫</button>
      <button class="filter-tab" data-category="games">🎮 游戏像素</button>
      <button class="filter-tab" data-category="architecture">🏯 名胜古建</button>
      <button class="filter-tab" data-category="pets">🐾 治愈萌宠</button>
      <button class="filter-tab" data-category="food">🍔 美食甜品</button>
      <button class="filter-tab" data-category="festival">🏮 节日庆典</button>
    </div>

    <div class="patterns-grid" id="patterns-grid"></div>
  </main>

  <!-- 图纸详情弹窗 -->
  <div class="modal-backdrop" id="pattern-modal" role="dialog" aria-modal="true" aria-label="图纸详情">
    <div class="modal-dialog">
      <button class="modal-close-btn" id="modal-close-btn" type="button" aria-label="关闭">&times;</button>
      <h2 id="modal-title" style="margin:0;font-size:22px;font-family:var(--font-display);"></h2>
      <p id="modal-desc" class="muted" style="font-size:13.5px;margin:8px 0 0;"></p>

      <div class="modal-layout">
        <div class="modal-canvas-wrap">
          <canvas id="modal-canvas" aria-label="图纸预览"></canvas>
        </div>

        <div class="modal-details">
          <span class="section-label section-label--plain">Color List</span>
          <div class="color-list" id="modal-color-list"></div>
          <p class="muted" style="font-size:12.5px;margin:0;">点击色卡，可在预览图中高亮该色号的全部豆子。</p>

          <div style="display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:8px;">
            <button id="modal-transfer-btn" class="btn btn-primary btn-block" type="button">用这张图开始创作 →</button>
            <button id="modal-export-btn" class="btn btn-outline btn-block" type="button">导出图纸 (PNG)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';
    import { BeadViewer, buildLegend, computeStats, renderPattern, fitCellToBox, aspectForMatrix } from './assets/js/bead-viewer.js';

    try { injectChrome('inspiration'); } catch (e) { console.warn(e); }

    const gridContainer = document.getElementById('patterns-grid');
    const modal = document.getElementById('pattern-modal');
    const modalCanvas = document.getElementById('modal-canvas');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalColorList = document.getElementById('modal-color-list');

    const thumbs = [];
    let modalViewer = null;
    let selectedPattern = null;
    let modalHighlight = null;

    const galleryCount = document.getElementById('gallery-count');
    if (galleryCount) galleryCount.textContent = String(ALL_PATTERNS.length);

    const EXHIBIT_THEME = {
      isDark: false,
      canvasBg: '#ffffff',
      grid: 'rgba(15,23,42,0.10)',
      gridStrong: 'rgba(15,23,42,0.2)',
      rulerText: '#64748b',
      accent: '#0052ff',
      check: '#10b981',
    };

    function renderCards(filter = 'all') {
      gridContainer.innerHTML = '';
      thumbs.length = 0;

      const list = filter === 'all' ? ALL_PATTERNS : ALL_PATTERNS.filter(p => p.category === filter);
      list.forEach((p, i) => {
        const rows = p.matrix.length;
        const cols = p.matrix[0].length;

        const card = document.createElement('article');
        card.className = 'pattern-card reveal';
        card.innerHTML = `
          <div class="pattern-preview-box">
            <canvas class="pattern-canvas-thumb" aria-label="${p.title} 预览"></canvas>
          </div>
          <div class="pattern-info">
            <div class="pattern-title-row">
              <span class="pattern-title">${p.title}</span>
              <span class="badge badge--accent">${p.tag || '精选'}</span>
            </div>
            <div class="pattern-meta">
              <span>${cols}×${rows} 网格</span>
              <span>${p.difficulty || ''}</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(p));
        gridContainer.appendChild(card);

        // 外框贴合图纸比例：留白更少、图纸更醒目
        const box = card.querySelector('.pattern-preview-box');
        box.style.aspectRatio = String(aspectForMatrix(cols, rows));

        const canvas = card.querySelector('canvas');
        const viewer = new BeadViewer(canvas, {
          cellSize: 8,
          beadStyle: 'round',
          gap: 'small',
          showGrid: false,
          showCode: false,
          showRuler: false,
        });
        viewer.setMatrix(p.matrix);
        thumbs.push({ viewer, box, cols, rows });

        setTimeout(() => card.classList.add('is-visible'), Math.min(i, 10) * 40);
      });

      requestAnimationFrame(layoutThumbs);
    }

    /** 按容器实测尺寸重算缩略图格子大小，图片填满外框 */
    function layoutThumbs() {
      thumbs.forEach(({ viewer, box, cols, rows }) => {
        viewer.setOptions({ cellSize: fitCellToBox(box, cols, rows, 16) });
      });
    }

    let thumbResizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(thumbResizeTimer);
      thumbResizeTimer = setTimeout(layoutThumbs, 160);
    });

    function openModal(p) {
      selectedPattern = p;
      modalHighlight = null;
      modalTitle.textContent = p.title;
      modalDesc.textContent = `${p.tag || ''} · ${p.desc || ''}`;

      const dim = Math.max(p.matrix.length, p.matrix[0].length, 1);
      const cellSize = Math.max(8, Math.min(34, Math.floor(520 / dim)));

      modalViewer = new BeadViewer(modalCanvas, {
        cellSize,
        beadStyle: 'round',
        gap: 'small',
        showGrid: true,
        showCode: cellSize >= 17,
        showRuler: true,
        highlightCode: null,
      });
      modalViewer.setMatrix(p.matrix);

      const stats = computeStats(p.matrix);
      renderModalLegend(stats.list);

      modal.classList.add('open');
      document.body.classList.add('is-locked');
    }

    function renderModalLegend(statsList) {
      buildLegend(modalColorList, statsList, { activeCode: modalHighlight });
      modalColorList.querySelectorAll('.bead-legend-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const code = btn.dataset.code;
          modalHighlight = modalHighlight === code ? null : code;
          modalViewer.setOptions({ highlightCode: modalHighlight });
          renderModalLegend(statsList);
        });
      });
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.classList.remove('is-locked');
    }

    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    modal.addEventListener('click', e => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });

    document.getElementById('modal-transfer-btn').addEventListener('click', () => {
      if (!selectedPattern) return;
      window.location.href = `create.html?patternId=${encodeURIComponent(selectedPattern.id)}`;
    });

    document.getElementById('modal-export-btn').addEventListener('click', () => {
      if (!selectedPattern) return;
      const dim = Math.max(selectedPattern.matrix.length, selectedPattern.matrix[0].length, 1);
      const cellSize = Math.max(24, Math.min(64, Math.floor(1440 / dim)));
      const off = document.createElement('canvas');
      const ctx = off.getContext('2d');
      renderPattern(ctx, selectedPattern.matrix, {
        cellSize,
        beadStyle: 'round',
        gap: 'small',
        showGrid: true,
        showCode: true,
        showRuler: true,
        theme: EXHIBIT_THEME,
      });
      const link = document.createElement('a');
      link.download = `Micheal-Beads-${selectedPattern.id}.png`;
      link.href = off.toDataURL('image/png');
      link.click();
    });

    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.dataset.category);
        updateTabCounts();
      });
    });

    /** 在筛选标签上补齐各类数量，方便一眼看到图库规模 */
    function updateTabCounts() {
      const countOf = cat => (cat === 'all' ? ALL_PATTERNS.length : ALL_PATTERNS.filter(p => p.category === cat).length);
      document.querySelectorAll('.filter-tab').forEach(btn => {
        const label = btn.textContent.replace(/\s*\(\d+\)$/, '');
        btn.textContent = `${label} (${countOf(btn.dataset.category)})`;
      });
    }

    window.addEventListener('site:themechange', () => {
      layoutThumbs();
      if (modalViewer && modal.classList.contains('open')) modalViewer.render();
    });

    renderCards('all');
    updateTabCounts();
  </script>
</body>
</html>
