<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作灵感 · Micheal 的拼豆网</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <style>
    .inspiration-container { max-width: 1300px; margin: 0 auto; padding: 32px 20px; }
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }
    .filter-tab {
      padding: 8px 18px; border-radius: 9999px; border: 1px solid #e2e8f0;
      background: #ffffff; color: #475569; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-tab.active {
      background: #2563eb; color: #ffffff; border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .patterns-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;
    }
    .pattern-card {
      background: #ffffff; border-radius: 16px; border: 1px solid #f1f5f9;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04); padding: 14px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; transition: all 0.2s ease;
    }
    .pattern-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08); }
    .pattern-preview-box {
      width: 100%; aspect-ratio: 1 / 1; background: #f8fafc; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
    }
    .pattern-canvas-thumb { max-width: 90%; max-height: 90%; object-fit: contain; }
    .pattern-info { width: 100%; display: flex; flex-direction: column; gap: 4px; }
    .pattern-title-row { display: flex; justify-content: space-between; align-items: center; }
    .pattern-title { font-size: 15px; font-weight: 700; color: #1e293b; }
    .pattern-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #eff6ff; color: #2563eb; font-weight: 600; }
    .pattern-meta { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }

    /* 弹窗 Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-dialog {
      background: #ffffff; border-radius: 20px; max-width: 860px; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 24px; position: relative;
    }
    .modal-close-btn {
      position: absolute; top: 18px; right: 18px; border: none; background: #f1f5f9;
      width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer;
    }
    .modal-layout { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 16px; }
    .modal-canvas-wrap {
      flex: 1 1 360px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 16px; display: flex; align-items: center; justify-content: center; max-height: 480px; overflow: auto;
    }
    .modal-details { flex: 1 1 300px; display: flex; flex-direction: column; gap: 12px; }
    .color-list { max-height: 220px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; }
    .color-list-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .color-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="inspiration-container">
    <div>
      <h1 style="font-size: 26px; color: #1e293b; margin-bottom: 6px;">✨ 精选拼豆创作图纸库 (50+款)</h1>
      <p style="color: #64748b; font-size: 14px;">涵盖网络顶流、动漫 IP、人文建筑、治愈萌宠与节日美食。点击即可带入创作页进行编辑。</p>
    </div>

    <!-- 筛选 -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-category="all">全部 (50+)</button>
      <button class="filter-tab" data-category="anime">🔥 热门动漫</button>
      <button class="filter-tab" data-category="architecture">🏯 名胜古建</button>
      <button class="filter-tab" data-category="pets">🐾 治愈萌宠</button>
      <button class="filter-tab" data-category="food">🍔 美食甜品</button>
      <button class="filter-tab" data-category="festival">🏮 节日庆典</button>
    </div>

    <div class="patterns-grid" id="patterns-grid"></div>
  </main>

  <!-- 弹窗 -->
  <div class="modal-backdrop" id="pattern-modal">
    <div class="modal-dialog">
      <button class="modal-close-btn" id="modal-close-btn">&times;</button>
      <h2 id="modal-title" style="margin: 0; color: #1e293b; font-size: 20px;"></h2>
      <p id="modal-desc" style="color: #64748b; font-size: 13px; margin: 4px 0 0 0;"></p>

      <div class="modal-layout">
        <div class="modal-canvas-wrap">
          <canvas id="modal-canvas"></canvas>
        </div>

        <div class="modal-details">
          <h4 style="margin: 0; color: #334155;">🎨 所需色号清单</h4>
          <div class="color-list" id="modal-color-list"></div>

          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
            <button id="modal-transfer-btn" class="btn btn-primary" style="padding: 10px; font-weight: bold;">
              🖌️ 用这张图开始创作 →
            </button>
            <button id="modal-export-btn" class="btn" style="padding: 10px;">
              📥 导出高清图纸 (PNG)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';

    try { injectChrome('inspiration'); } catch (e) { console.warn(e); }

    function drawPattern(canvas, matrix, cellSize = 22, showLabels = false) {
      const h = matrix.length;
      const w = matrix[0].length;
      canvas.width = w * cellSize;
      canvas.height = h * cellSize;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const bead = matrix[y][x];
          if (!bead) continue;
          const cx = x * cellSize + cellSize / 2;
          const cy = y * cellSize + cellSize / 2;
          const radius = cellSize * 0.44;

          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fillStyle = bead.hex;
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(cx, cy, radius * 0.35, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fill();

          if (showLabels && cellSize >= 26) {
            const lum = 0.299 * bead.r + 0.587 * bead.g + 0.114 * bead.b;
            ctx.font = `bold ${Math.floor(cellSize * 0.32)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = lum > 140 ? '#000000' : '#ffffff';
            ctx.fillText(bead.code, cx, cy);
          }
        }
      }
    }

    const gridContainer = document.getElementById('patterns-grid');

    function renderCards(filter = 'all') {
      gridContainer.innerHTML = '';
      const list = filter === 'all' ? ALL_PATTERNS : ALL_PATTERNS.filter(p => p.category === filter);

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'pattern-card';
        card.innerHTML = `
          <div class="pattern-preview-box">
            <canvas id="cv-${p.id}" class="pattern-canvas-thumb"></canvas>
          </div>
          <div class="pattern-info">
            <div class="pattern-title-row">
              <span class="pattern-title">${p.title}</span>
              <span class="pattern-tag">${p.tag}</span>
            </div>
            <div class="pattern-meta">
              <span>${p.matrix[0].length}×${p.matrix.length} 网格</span>
              <span style="color:#f59e0b;">${p.difficulty}</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(p));
        gridContainer.appendChild(card);
        drawPattern(card.querySelector(`#cv-${p.id}`), p.matrix, 16, false);
      });
    }

    let selectedPattern = null;
    const modal = document.getElementById('pattern-modal');
    const modalCanvas = document.getElementById('modal-canvas');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalColorList = document.getElementById('modal-color-list');

    function openModal(p) {
      selectedPattern = p;
      modalTitle.textContent = p.title;
      modalDesc.textContent = `${p.tag} · ${p.desc}`;
      drawPattern(modalCanvas, p.matrix, 30, true);

      const colorMap = {};
      p.matrix.forEach(row => row.forEach(b => {
        if (b) {
          colorMap[b.code] = colorMap[b.code] || { ...b, count: 0 };
          colorMap[b.code].count++;
        }
      }));

      modalColorList.innerHTML = '';
      Object.values(colorMap).sort((a, b) => b.count - a.count).forEach(item => {
        const div = document.createElement('div');
        div.className = 'color-list-item';
        div.innerHTML = `
          <div><span class="color-dot" style="background:${item.hex};"></span><strong>${item.code}</strong> (${item.name})</div>
          <span>${item.count} 颗</span>
        `;
        modalColorList.appendChild(div);
      });

      modal.classList.add('open');
    }

    document.getElementById('modal-close-btn').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    // 一键携带图纸跳转创作页
    document.getElementById('modal-transfer-btn').addEventListener('click', () => {
      if (!selectedPattern) return;
      window.location.href = `create.html?patternId=${encodeURIComponent(selectedPattern.id)}`;
    });

    // 导出 PNG
    document.getElementById('modal-export-btn').addEventListener('click', () => {
      if (!selectedPattern) return;
      const link = document.createElement('a');
      link.download = `Micheal-Beads-${selectedPattern.id}.png`;
      link.href = modalCanvas.toDataURL('image/png');
      link.click();
    });

    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.dataset.category);
      });
    });

    renderCards('all');
  </script>
</body>
</html>
