<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作工坊 · Micheal 的拼豆网</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <style>
    .create-container {
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .panel-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin: 16px 0;
    }
    .canvas-row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 20px;
    }
    .canvas-box {
      flex: 1 1 480px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
      max-height: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-label {
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
      align-self: flex-start;
    }
    .board-canvas, .preview-canvas {
      max-width: 100%;
      height: auto;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      border-radius: 6px;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: center;
    }
    .stats-table th {
      background: var(--table-head);
      color: var(--text-main);
    }
    .color-chip {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .export-row {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }
    .form-select, .form-range {
      accent-color: var(--primary);
    }
    .form-select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="create-container">
    <section class="panel-card">
      <h2 style="margin: 0; color: var(--text-main);">拼豆设计工坊</h2>
      <div class="control-row">
        <label class="btn btn-primary" style="cursor: pointer;">
          📁 上传图片 / 更换图片
          <input id="upload-input" type="file" accept="image/*,.gif" hidden />
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-main);">
          <input id="bg-toggle" type="checkbox" /> 智能抠除背景 (浅色/纯白/透明)
        </label>
        <div style="display: flex; align-items: center; gap: 8px; color: var(--text-main);">
          <label>板宽：<span id="board-width-val" style="font-weight: 700; color: var(--primary);">30</span> 格</label>
          <input id="board-width" class="form-range" type="range" min="10" max="80" step="1" value="30" />
        </div>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-main);">
          <input id="labels-toggle" type="checkbox" checked /> 标注色号
        </label>
        <label style="display: flex; align-items: center; gap: 6px; color: var(--text-main);">
          选色板：
          <select id="palette-select" class="form-select">
            <option value="artkal">Artkal 标准 50 色</option>
            <option value="perler">Perler 经典色板</option>
            <option value="hama">Hama 精选色板</option>
            <option value="retro">复古像素 16 色</option>
          </select>
        </label>
      </div>

      <p id="convert-status" style="color: var(--text-muted); font-weight: 500; margin: 4px 0;"></p>

      <div class="canvas-row">
        <div class="canvas-box">
          <span class="canvas-label">拼豆高清图纸（含智能色号标尺）</span>
          <canvas id="board-canvas" class="board-canvas"></canvas>
        </div>
        <div class="canvas-box">
          <span class="canvas-label">像素原图预览</span>
          <canvas id="preview-canvas" class="preview-canvas"></canvas>
        </div>
      </div>

      <!-- 用色明细 -->
      <div id="stats"></div>

      <!-- 导出 -->
      <div class="export-row">
        <button id="export-png" class="btn btn-primary" type="button">✨ 导出超清图纸 (Ultra-HD PNG)</button>
        <button id="export-csv" class="btn" type="button">📊 导出用色清单 (CSV)</button>
      </div>
    </section>

    <!-- 更多入口 -->
    <section class="panel-card">
      <h3 style="margin-top: 0;">从白板自由创作</h3>
      <p style="color: var(--text-muted); font-size: 14px;">打开纯净像素画板自由画图，支持多种画笔工具与实时用色统计。</p>
      <a href="whiteboard.html" class="btn btn-primary" style="text-decoration: none;">打开白板编辑器 →</a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';

    try { injectChrome('create'); } catch (e) { console.warn(e); }

    // 全色板数据源
    const PALETTES = {
      artkal: [
        { code: 'S01', name: '纯白', hex: '#FFFFFF', r: 255, g: 255, b: 255 },
        { code: 'S02', name: '纯黑', hex: '#18181B', r: 24, g: 24, b: 27 },
        { code: 'S03', name: '正红', hex: '#DC2626', r: 220, g: 38, b: 38 },
        { code: 'S04', name: '暗红', hex: '#991B1B', r: 153, g: 27, b: 27 },
        { code: 'S05', name: '芭比粉', hex: '#EC4899', r: 236, g: 72, b: 153 },
        { code: 'S06', name: '浅粉', hex: '#FBCFE8', r: 251, g: 207, b: 232 },
        { code: 'S07', name: '天蓝', hex: '#38BDF8', r: 56, g: 189, b: 248 },
        { code: 'S08', name: '宝蓝', hex: '#2563EB', r: 37, g: 99, b: 235 },
        { code: 'S09', name: '藏青', hex: '#1E3A8A', r: 30, g: 58, b: 138 },
        { code: 'S10', name: '草绿', hex: '#4ADE80', r: 74, g: 222, b: 128 },
        { code: 'S11', name: '墨绿', hex: '#166534', r: 22, g: 101, b: 52 },
        { code: 'S12', name: '嫩绿', hex: '#BBF7D0', r: 187, g: 247, b: 208 },
        { code: 'S13', name: '明黄', hex: '#FACC15', r: 250, g: 204, b: 21 },
        { code: 'S14', name: '金黄', hex: '#D97706', r: 217, g: 119, b: 6 },
        { code: 'S15', name: '活力橙', hex: '#FB923C', r: 251, g: 146, b: 60 },
        { code: 'S16', name: '深橙', hex: '#EA580C', r: 234, g: 88, b: 12 },
        { code: 'S17', name: '香芋紫', hex: '#C084FC', r: 192, g: 132, b: 252 },
        { code: 'S18', name: '深紫', hex: '#7E22CE', r: 126, g: 34, b: 206 },
        { code: 'S19', name: '暖肤色', hex: '#FED7AA', r: 254, g: 215, b: 170 },
        { code: 'S20', name: '奶茶色', hex: '#D7CCC8', r: 215, g: 204, b: 200 },
        { code: 'S21', name: '摩卡棕', hex: '#A16207', r: 161, g: 98, b: 7 },
        { code: 'S22', name: '浓缩咖啡', hex: '#451A03', r: 69, g: 26, b: 3 },
        { code: 'S23', name: '银灰', hex: '#E2E8F0', r: 226, g: 232, b: 240 },
        { code: 'S24', name: '质感灰', hex: '#94A3B8', r: 148, g: 163, b: 184 },
        { code: 'S25', name: '碳深灰', hex: '#475569', r: 71, g: 85, b: 105 },
        { code: 'S26', name: '薄荷蓝', hex: '#A5F3FC', r: 165, g: 243, b: 252 },
        { code: 'S27', name: '孔雀绿', hex: '#0D9488', r: 13, g: 148, b: 136 },
        { code: 'S28', name: '珊瑚粉', hex: '#FB7185', r: 251, g: 113, b: 133 },
        { code: 'S29', name: '奶黄', hex: '#FEF08A', r: 254, g: 240, b: 138 }
      ],
      perler: [
        { code: 'P01', name: 'White', hex: '#FFFFFF', r: 255, g: 255, b: 255 },
        { code: 'P02', name: 'Black', hex: '#141414', r: 20, g: 20, b: 20 },
        { code: 'P03', name: 'Red', hex: '#D2232A', r: 210, g: 35, b: 42 },
        { code: 'P05', name: 'Bubblegum', hex: '#F472B6', r: 244, g: 114, b: 177 },
        { code: 'P07', name: 'Light Blue', hex: '#60A5FA', r: 96, g: 165, b: 250 },
        { code: 'P08', name: 'Cobalt', hex: '#1D4ED8', r: 29, g: 78, b: 216 },
        { code: 'P10', name: 'Kiwi Lime', hex: '#84CC16', r: 132, g: 204, b: 22 },
        { code: 'P13', name: 'Yellow', hex: '#FDE047', r: 253, g: 224, b: 71 },
        { code: 'P15', name: 'Orange', hex: '#F97316', r: 249, g: 115, b: 22 },
        { code: 'P18', name: 'Purple', hex: '#9333EA', r: 147, g: 51, b: 234 },
        { code: 'P21', name: 'Light Brown', hex: '#B47A52', r: 180, g: 122, b: 82 }
      ],
      hama: [
        { code: 'H01', name: 'White', hex: '#FFFFFF', r: 255, g: 255, b: 255 },
        { code: 'H03', name: 'Yellow', hex: '#FACC15', r: 250, g: 204, b: 21 },
        { code: 'H04', name: 'Orange', hex: '#F97316', r: 249, g: 115, b: 22 },
        { code: 'H05', name: 'Red', hex: '#E11D48', r: 225, g: 29, b: 72 },
        { code: 'H08', name: 'Blue', hex: '#2563EB', r: 37, g: 99, b: 235 },
        { code: 'H10', name: 'Green', hex: '#22C55E', r: 34, g: 197, b: 94 },
        { code: 'H14', name: 'Black', hex: '#111827', r: 17, g: 24, b: 39 }
      ],
      retro: [
        { code: 'R01', name: '墨黑', hex: '#0F0F0F', r: 15, g: 15, b: 15 },
        { code: 'R02', name: '深灰', hex: '#4B4B4B', r: 75, g: 75, b: 75 },
        { code: 'R03', name: '浅灰', hex: '#A0A0A0', r: 160, g: 160, b: 160 },
        { code: 'R04', name: '纯白', hex: '#FAFAFA', r: 250, g: 250, b: 250 },
        { code: 'R05', name: '像素红', hex: '#EB3B5A', r: 235, g: 59, b: 90 },
        { code: 'R06', name: '像素蓝', hex: '#3867D6', r: 56, g: 103, b: 214 },
        { code: 'R07', name: '像素黄', hex: '#FED330', r: 254, g: 211, b: 48 },
        { code: 'R08', name: '像素绿', hex: '#20BF6B', r: 32, g: 191, b: 107 }
      ]
    };

    let currentImg = null;
    let gridData = [];

    const uploadInput = document.getElementById('upload-input');
    const bgToggle = document.getElementById('bg-toggle');
    const boardWidthInput = document.getElementById('board-width');
    const boardWidthVal = document.getElementById('board-width-val');
    const labelsToggle = document.getElementById('labels-toggle');
    const paletteSelect = document.getElementById('palette-select');
    const statusText = document.getElementById('convert-status');
    const boardCanvas = document.getElementById('board-canvas');
    const previewCanvas = document.getElementById('preview-canvas');
    const statsContainer = document.getElementById('stats');
    const exportPngBtn = document.getElementById('export-png');
    const exportCsvBtn = document.getElementById('export-csv');

    // 载入 URL 传入的图纸
    const urlParams = new URLSearchParams(window.location.search);
    const patternId = urlParams.get('patternId');
    if (patternId) {
      const found = ALL_PATTERNS.find(p => p.id === patternId);
      if (found) {
        gridData = found.matrix;
        boardWidthInput.value = found.matrix[0].length;
        boardWidthVal.textContent = found.matrix[0].length;
        renderCanvases();
        buildStatsFromGrid();
        statusText.textContent = `已载入图纸：「${found.title}」(${found.matrix[0].length}×${found.matrix.length} 网格)`;
      }
    }

    // 图片上传事件监听
    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          currentImg = img;
          processImage();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    boardWidthInput.addEventListener('input', (e) => {
      boardWidthVal.textContent = e.target.value;
      if (currentImg) processImage();
    });

    labelsToggle.addEventListener('change', () => { if (gridData.length) renderCanvases(); });
    bgToggle.addEventListener('change', () => { if (currentImg) processImage(); });
    paletteSelect.addEventListener('change', () => { if (currentImg) processImage(); });

    // 颜色距离匹配函数
    function findNearestColor(r, g, b, palette) {
      let minDist = Infinity;
      let matched = palette[0];
      for (const item of palette) {
        const rmean = (r + item.r) / 2;
        const dr = r - item.r;
        const dg = g - item.g;
        const db = b - item.b;
        const dist = (2 + rmean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rmean) / 256) * db * db;
        if (dist < minDist) {
          minDist = dist;
          matched = item;
        }
      }
      return matched;
    }

    // 智能图像处理与拼豆网格计算
    function processImage() {
      if (!currentImg) return;
      statusText.textContent = '正在转换图像为拼豆图纸...';

      const targetWidth = parseInt(boardWidthInput.value, 10);
      const aspectRatio = currentImg.naturalHeight / currentImg.naturalWidth;
      const targetHeight = Math.max(1, Math.round(targetWidth * aspectRatio));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = targetWidth;
      offCanvas.height = targetHeight;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(currentImg, 0, 0, targetWidth, targetHeight);

      const imgData = offCtx.getImageData(0, 0, targetWidth, targetHeight).data;
      const autoBg = bgToggle.checked;
      const activePalette = PALETTES[paletteSelect.value] || PALETTES.artkal;

      // 智能取样左上角像素作为背景参考
      const cornerR = imgData[0], cornerG = imgData[1], cornerB = imgData[2], cornerA = imgData[3];

      gridData = [];
      const statsMap = {};

      for (let y = 0; y < targetHeight; y++) {
        const row = [];
        for (let x = 0; x < targetWidth; x++) {
          const idx = (y * targetWidth + x) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const a = imgData[idx + 3];

          let isBg = false;
          // 透明度检测
          if (a < 60) isBg = true;
          // 近白色背景检测
          else if (autoBg && r > 230 && g > 230 && b > 230) isBg = true;
          // 角落纯色背景容差检测
          else if (autoBg && cornerA > 200) {
            const dist = Math.hypot(r - cornerR, g - cornerG, b - cornerB);
            if (dist < 32) isBg = true;
          }

          if (isBg) {
            row.push(null);
          } else {
            const bead = findNearestColor(r, g, b, activePalette);
            row.push(bead);
            statsMap[bead.code] = statsMap[bead.code] || { ...bead, count: 0 };
            statsMap[bead.code].count += 1;
          }
        }
        gridData.push(row);
      }

      renderCanvases();
      renderStats(statsMap);
      statusText.textContent = `生成成功：${targetWidth} × ${targetHeight} 网格 (${activePalette.length} 色色板)`;
    }

    // 绘制单个拼豆颗粒与高对比度文字
    function drawBeadCell(ctx, bead, cx, cy, cellSize, showLabels) {
      const centerX = cx + cellSize / 2;
      const centerY = cy + cellSize / 2;
      const radius = cellSize * 0.44;

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
      ctx.fill();
      ctx.lineWidth = Math.max(1, cellSize * 0.04);
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fill();

      if (showLabels) {
        const fontSize = Math.max(8, Math.floor(cellSize * 0.34));
        ctx.font = `bold ${fontSize}px monospace, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lum = 0.2126 * (bead.r || 100) + 0.7152 * (bead.g || 100) + 0.0722 * (bead.b || 100);
        const isBright = lum > 145;

        ctx.lineWidth = Math.max(2, fontSize * 0.25);
        ctx.strokeStyle = isBright ? '#ffffff' : '#000000';
        ctx.strokeText(bead.code, centerX, centerY);
        ctx.fillStyle = isBright ? '#000000' : '#ffffff';
        ctx.fillText(bead.code, centerX, centerY);
      }
    }

    // 渲染页面内的画板
    function renderCanvases() {
      if (gridData.length === 0) return;
      const height = gridData.length;
      const width = gridData[0].length;

      // 像素预览
      const pixelSize = 8;
      previewCanvas.width = width * pixelSize;
      previewCanvas.height = height * pixelSize;
      const pCtx = previewCanvas.getContext('2d');
      pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const bead = gridData[y][x];
          if (bead) {
            pCtx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
            pCtx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
          }
        }
      }

      // 图纸网格
      const cellSize = 32;
      boardCanvas.width = width * cellSize;
      boardCanvas.height = height * cellSize;
      const bCtx = boardCanvas.getContext('2d');
      bCtx.fillStyle = '#f8fafc';
      bCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

      const showLabels = labelsToggle.checked;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = x * cellSize;
          const cy = y * cellSize;
          bCtx.strokeStyle = '#e2e8f0';
          bCtx.lineWidth = 1;
          bCtx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = gridData[y][x];
          if (bead) {
            drawBeadCell(bCtx, bead, cx, cy, cellSize, showLabels);
          }
        }
      }
    }

    function buildStatsFromGrid() {
      const statsMap = {};
      gridData.forEach(row => row.forEach(b => {
        if (b) {
          statsMap[b.code] = statsMap[b.code] || { ...b, count: 0 };
          statsMap[b.code].count++;
        }
      }));
      renderStats(statsMap);
    }

    function renderStats(statsMap) {
      const items = Object.values(statsMap).sort((a, b) => b.count - a.count);
      if (items.length === 0) {
        statsContainer.innerHTML = '';
        return;
      }
      let total = items.reduce((sum, item) => sum + item.count, 0);
      let html = `
        <h3 style="color: var(--text-main); margin-top: 24px;">🎨 用色清单 (共使用 ${items.length} 种颜色，${total} 颗拼豆)</h3>
        <table class="stats-table">
          <thead><tr><th>色号</th><th>颜色</th><th>名称</th><th>所需数量</th></tr></thead>
          <tbody>
      `;
      for (const item of items) {
        html += `
          <tr>
            <td><strong>${item.code}</strong></td>
            <td><span class="color-chip" style="background: ${item.hex || `rgb(${item.r},${item.g},${item.b})`};"></span></td>
            <td>${item.name || item.code}</td>
            <td>${item.count} 颗</td>
          </tr>
        `;
      }
      html += '</tbody></table>';
      statsContainer.innerHTML = html;
    }

    // 导出超清 PNG (带坐标系)
    exportPngBtn.addEventListener('click', () => {
      if (gridData.length === 0) return alert('请先上传图片生成拼豆图纸！');
      const height = gridData.length;
      const width = gridData[0].length;
      const cellSize = 64;
      const rulerSize = 40;

      const hdCanvas = document.createElement('canvas');
      hdCanvas.width = width * cellSize + rulerSize;
      hdCanvas.height = height * cellSize + rulerSize;
      const ctx = hdCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, hdCanvas.width, hdCanvas.height);

      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let x = 0; x < width; x++) {
        ctx.fillText((x + 1).toString(), rulerSize + x * cellSize + cellSize / 2, rulerSize / 2);
      }
      for (let y = 0; y < height; y++) {
        ctx.fillText((y + 1).toString(), rulerSize / 2, rulerSize + y * cellSize + cellSize / 2);
      }

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rulerSize, 0); ctx.lineTo(rulerSize, hdCanvas.height);
      ctx.moveTo(0, rulerSize); ctx.lineTo(hdCanvas.width, rulerSize);
      ctx.stroke();

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = rulerSize + x * cellSize;
          const cy = rulerSize + y * cellSize;

          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = gridData[y][x];
          if (bead) {
            drawBeadCell(ctx, bead, cx, cy, cellSize, true);
          }
        }
      }

      const link = document.createElement('a');
      link.download = `Micheal-Beads-HD-${width}x${height}.png`;
      link.href = hdCanvas.toDataURL('image/png', 1.0);
      link.click();
    });

    // 导出 CSV
    exportCsvBtn.addEventListener('click', () => {
      if (gridData.length === 0) return alert('请先生成拼豆图纸！');
      let csv = '\uFEFF色号,颜色名称,所需颗粒数\n';
      const statsMap = {};
      gridData.flat().filter(Boolean).forEach(b => {
        statsMap[b.code] = statsMap[b.code] || { name: b.name || b.code, count: 0 };
        statsMap[b.code].count++;
      });
      for (const code in statsMap) {
        csv += `"${code}","${statsMap[code].name}",${statsMap[code].count}\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'bead-shopping-list.csv';
      link.click();
    });
  </script>
</body>
</html>
