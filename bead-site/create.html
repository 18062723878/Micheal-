<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作工坊 · Micheal 的拼豆网</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    .create-container {
      max-width: 1380px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .panel-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin: 16px 0;
    }

    .url-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .help-icon-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--primary);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s;
    }
    .help-icon-btn:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .url-help-popover {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 320px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      z-index: 100;
    }
    .url-help-popover.show {
      display: block;
    }
    .url-help-popover h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: var(--text-main);
    }
    .url-help-popover ol {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .url-help-popover .tip-box {
      margin-top: 10px;
      padding: 8px 10px;
      background: var(--bg-secondary);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      border-left: 3px solid var(--accent);
    }

    .bg-cutout-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .filter-controls-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 16px 0;
    }
    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }
    .slider-val-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 700;
      min-width: 38px;
      text-align: center;
    }
    .slider-item input[type="range"] {
      width: 100%;
    }

    .canvas-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .canvas-box {
      flex: 1 1 500px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
      max-height: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-label {
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .board-canvas, .schematic-canvas {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      background: var(--canvas-bg);
      cursor: pointer;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: center;
    }
    .stats-table th {
      background: var(--table-head);
      color: var(--text-main);
    }
    .stats-table tr.is-highlighted {
      background: rgba(37, 99, 235, 0.12);
      outline: 2px solid var(--primary);
    }
    .stats-table tr.is-excluded {
      opacity: 0.45;
      text-decoration: line-through;
    }
    .color-chip {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }
    .form-select, .form-input {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* 原生裁剪弹窗 */
    .crop-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }
    .crop-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .crop-modal-dialog {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 780px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .crop-canvas-container {
      width: 100%;
      height: 380px;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none;
    }
    #crop-canvas {
      cursor: crosshair;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="create-container">
    <section class="panel-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <h2 style="margin: 0; color: var(--text-main);">拼豆设计工坊</h2>
        <a href="whiteboard.html" class="btn btn-outline" style="text-decoration: none; font-size: 13px; font-weight: 600;">
          前往白板自由画板 →
        </a>
      </div>

      <!-- 第一控制条：输入与抠图 -->
      <div class="control-row">
        <label class="btn btn-primary" style="cursor: pointer;">
          上传本地图片
          <input id="upload-input" type="file" accept="image/*,.gif" hidden />
        </label>
        
        <div class="url-input-wrap">
          <input id="url-input" class="form-input" type="url" placeholder="粘贴网络图片直链..." style="width: 190px;" />
          <button id="btn-import-url" class="btn" type="button">导入网络图</button>
          <button id="btn-url-help" class="help-icon-btn" type="button">怎么填？</button>
          
          <div id="url-help-popover" class="url-help-popover">
            <h4>如何获取有效图片链接？</h4>
            <ol>
              <li>在网页图片上右键，点击<strong>「复制图片地址」</strong>。</li>
              <li>粘贴至输入框后点击【导入网络图】。</li>
            </ol>
            <div class="tip-box">
              <strong>提示：</strong>若对方网站有防盗链拦截，直接将图片<strong>「另存为」</strong>到本地，点击【上传本地图片】即可导入。
            </div>
          </div>
        </div>

        <div class="bg-cutout-group">
          <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-main); font-weight: 600; font-size: 13px;">
            <input id="bg-toggle" type="checkbox" checked /> 智能抠除背景
          </label>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted);">
            <span>容差:</span>
            <input id="bg-tolerance" type="range" min="10" max="100" step="2" value="38" style="width: 75px;" />
            <span id="bg-tolerance-val" style="font-weight: 700; color: var(--primary); font-family: monospace;">38</span>
          </div>
        </div>

        <button id="btn-reset-filters" class="btn" type="button" style="margin-left: auto;">重置所有参数</button>
      </div>

      <!-- 第二控制条：专业高级功能设置 -->
      <div class="control-row" style="background: var(--bg-secondary); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 8px;">
        <label style="display: flex; align-items: center; gap: 6px; color: var(--text-main); font-size: 13px;">
          色板：
          <select id="palette-select" class="form-select">
            <option value="standard72">72 色常用标准版</option>
            <option value="classic88">88 色盒装经典版 (X1~X88)</option>
            <option value="advance144">144 色进阶专业版</option>
            <option value="full221">221 色豪华全谱版 (A-H/M)</option>
          </select>
        </label>

        <label style="display: flex; align-items: center; gap: 6px; color: var(--text-main); font-size: 13px;">
          色数限制：
          <select id="max-color-select" class="form-select">
            <option value="0">不限制</option>
            <option value="8">最多 8 色</option>
            <option value="12">最多 12 色</option>
            <option value="16">最多 16 色</option>
            <option value="24">最多 24 色</option>
            <option value="36">最多 36 色</option>
            <option value="48">最多 48 色</option>
          </select>
        </label>

        <label style="display: flex; align-items: center; gap: 6px; color: var(--text-main); font-size: 13px;">
          拼豆板分割线：
          <select id="pegboard-select" class="form-select">
            <option value="0">不分割</option>
            <option value="28">28 × 28 标准大方板</option>
            <option value="29">29 × 29 常用拼接板</option>
            <option value="50">50 × 50 超大连板</option>
            <option value="14">14 × 14 小型板</option>
          </select>
        </label>

        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-main); font-weight: 600; font-size: 13px;">
          <input id="mark-mode-toggle" type="checkbox" /> 拼装打卡模式 (点击格子标记已拼)
        </label>

        <button id="btn-clear-checks" class="btn" type="button" style="padding: 4px 10px; font-size: 12px; margin-left: auto;">清空打卡标记</button>
      </div>

      <!-- 参数调节面板 -->
      <div class="filter-controls-panel">
        <div class="slider-item">
          <div class="slider-header">
            <span class="slider-title">像素尺寸 (板宽)</span>
            <span id="board-width-val" class="slider-val-box">32px</span>
          </div>
          <input id="board-width" type="range" min="10" max="80" step="1" value="32" />
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span class="slider-title">孤立杂色平滑合并</span>
            <span id="noise-val" class="slider-val-box">0颗</span>
          </div>
          <input id="noise-threshold" type="range" min="0" max="5" step="1" value="0" />
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span class="slider-title">亮度</span>
            <span id="brightness-val" class="slider-val-box">0</span>
          </div>
          <input id="brightness-range" type="range" min="-100" max="100" step="1" value="0" />
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span class="slider-title">对比度</span>
            <span id="contrast-val" class="slider-val-box">0</span>
          </div>
          <input id="contrast-range" type="range" min="-100" max="100" step="1" value="0" />
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span class="slider-title">饱和度</span>
            <span id="saturate-val" class="slider-val-box">0</span>
          </div>
          <input id="saturate-range" type="range" min="-100" max="100" step="1" value="0" />
        </div>
      </div>

      <p id="convert-status" style="color: var(--text-muted); font-weight: 500; margin: 6px 0;"></p>

      <!-- 双画板联动展示 -->
      <div class="canvas-row">
        <div class="canvas-box">
          <span class="canvas-label">纯色实体拼豆效果</span>
          <canvas id="board-canvas" class="board-canvas"></canvas>
        </div>
        <div class="canvas-box">
          <span class="canvas-label" id="schematic-label">色号对照拼装图纸 (点击格子可交互高亮或打卡)</span>
          <canvas id="schematic-canvas" class="schematic-canvas"></canvas>
        </div>
      </div>

      <!-- 用色明细展示 -->
      <div id="stats"></div>

      <!-- 导出选项 -->
      <div style="display: flex; gap: 14px; margin-top: 24px;">
        <button id="export-png" class="btn btn-primary" type="button" style="padding: 11px 24px; font-weight: 700; font-size: 14px;">
          导出超清图纸 (PNG)
        </button>
        <button id="export-csv" class="btn" type="button" style="padding: 11px 24px; font-weight: 600; font-size: 14px;">
          导出色号矩阵 (CSV)
        </button>
      </div>
    </section>

    <!-- 底部白板自由创作入口卡片 -->
    <section class="panel-card">
      <h3 style="margin-top: 0; color: var(--text-main);">从白板自由创作</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 18px;">
        打开独立像素画板自由涂鸦绘制，支持画笔、油漆桶、橡皮擦、画面滤镜与用色实时统计。
      </p>
      <a href="whiteboard.html" class="btn btn-primary" style="text-decoration: none;">打开白板编辑器 →</a>
    </section>
  </main>

  <!-- 原生图片自由裁剪弹窗 -->
  <div id="crop-modal" class="crop-modal-backdrop">
    <div class="crop-modal-dialog">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; color: var(--text-main); font-size: 18px;">图片选区裁剪</h3>
        <span style="font-size: 12px; color: var(--text-muted);">在图片上按住鼠标或手指拖拽矩形框</span>
      </div>

      <div class="crop-canvas-container">
        <canvas id="crop-canvas"></canvas>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; gap: 8px;">
          <button id="btn-crop-full" class="btn" type="button">全选整图</button>
          <button id="btn-crop-square" class="btn" type="button">1:1 正方形居中</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-skip-crop" class="btn" type="button">直接使用原图</button>
          <button id="btn-confirm-crop" class="btn btn-primary" type="button">确认裁剪并生成</button>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS, PALETTES } from './assets/js/patterns-data.js';

    try { injectChrome('create'); } catch (e) { console.warn(e); }

    let currentImg = null;
    let gridData = [];
    let currentStatsMap = {};

    // 核心状态管理：排除色号、当前高亮聚焦色号、已完成打卡格子坐标集合
    const excludedColorCodes = new Set();
    let activeHighlightCode = null;
    const checkedBeadCoords = new Set(); // 格式: "x,y"

    const uploadInput = document.getElementById('upload-input');
    const urlInput = document.getElementById('url-input');
    const btnImportUrl = document.getElementById('btn-import-url');
    const btnUrlHelp = document.getElementById('btn-url-help');
    const urlHelpPopover = document.getElementById('url-help-popover');

    const bgToggle = document.getElementById('bg-toggle');
    const bgTolerance = document.getElementById('bg-tolerance');
    const bgToleranceVal = document.getElementById('bg-tolerance-val');
    const paletteSelect = document.getElementById('palette-select');
    const maxColorSelect = document.getElementById('max-color-select');
    const pegboardSelect = document.getElementById('pegboard-select');
    const markModeToggle = document.getElementById('mark-mode-toggle');
    const btnClearChecks = document.getElementById('btn-clear-checks');

    const statusText = document.getElementById('convert-status');
    const boardCanvas = document.getElementById('board-canvas');
    const schematicCanvas = document.getElementById('schematic-canvas');
    const statsContainer = document.getElementById('stats');
    const exportPngBtn = document.getElementById('export-png');
    const exportCsvBtn = document.getElementById('export-csv');

    const boardWidthInput = document.getElementById('board-width');
    const boardWidthVal = document.getElementById('board-width-val');
    const noiseThresholdInput = document.getElementById('noise-threshold');
    const noiseVal = document.getElementById('noise-val');
    const brightnessRange = document.getElementById('brightness-range');
    const brightnessVal = document.getElementById('brightness-val');
    const contrastRange = document.getElementById('contrast-range');
    const contrastVal = document.getElementById('contrast-val');
    const saturateRange = document.getElementById('saturate-range');
    const saturateVal = document.getElementById('saturate-val');
    const btnResetFilters = document.getElementById('btn-reset-filters');

    // 裁剪模态窗元素
    const cropModal = document.getElementById('crop-modal');
    const cropCanvas = document.getElementById('crop-canvas');
    const cropCtx = cropCanvas.getContext('2d');
    const btnCropFull = document.getElementById('btn-crop-full');
    const btnCropSquare = document.getElementById('btn-crop-square');
    const btnSkipCrop = document.getElementById('btn-skip-crop');
    const btnConfirmCrop = document.getElementById('btn-confirm-crop');
    let rawLoadedImg = null;
    let cropBox = { x: 0, y: 0, w: 0, h: 0 };
    let isCroppingDrag = false;
    let cropDragStart = { x: 0, y: 0 };

    btnUrlHelp.addEventListener('click', (e) => {
      e.stopPropagation();
      urlHelpPopover.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
      if (!urlHelpPopover.contains(e.target) && e.target !== btnUrlHelp) {
        urlHelpPopover.classList.remove('show');
      }
    });

    // -------------------------------------------------------------------------
    // 裁剪功能实现
    // -------------------------------------------------------------------------
    function openCropper(img) {
      rawLoadedImg = img;
      const maxW = 720;
      const maxH = 380;
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      const scale = Math.min(maxW / w, maxH / h, 1);

      cropCanvas.width = Math.round(w * scale);
      cropCanvas.height = Math.round(h * scale);
      cropBox = { x: 0, y: 0, w: cropCanvas.width, h: cropCanvas.height };
      drawCropCanvas();
      cropModal.classList.add('open');
    }

    function drawCropCanvas() {
      if (!rawLoadedImg) return;
      cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      cropCtx.drawImage(rawLoadedImg, 0, 0, cropCanvas.width, cropCanvas.height);

      // 半透明暗色蒙版
      cropCtx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      cropCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

      // 高亮保留选区
      cropCtx.clearRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
      cropCtx.drawImage(
        rawLoadedImg,
        (cropBox.x / cropCanvas.width) * rawLoadedImg.naturalWidth,
        (cropBox.y / cropCanvas.height) * rawLoadedImg.naturalHeight,
        (cropBox.w / cropCanvas.width) * rawLoadedImg.naturalWidth,
        (cropBox.h / cropCanvas.height) * rawLoadedImg.naturalHeight,
        cropBox.x, cropBox.y, cropBox.w, cropBox.h
      );

      // 边框描边
      cropCtx.strokeStyle = '#2563eb';
      cropCtx.lineWidth = 2;
      cropCtx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
    }

    cropCanvas.addEventListener('pointerdown', (e) => {
      const rect = cropCanvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(cropCanvas.width, (e.clientX - rect.left) * (cropCanvas.width / rect.width)));
      const y = Math.max(0, Math.min(cropCanvas.height, (e.clientY - rect.top) * (cropCanvas.height / rect.height)));
      isCroppingDrag = true;
      cropDragStart = { x, y };
      cropBox = { x, y, w: 0, h: 0 };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isCroppingDrag) return;
      const rect = cropCanvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(cropCanvas.width, (e.clientX - rect.left) * (cropCanvas.width / rect.width)));
      const y = Math.max(0, Math.min(cropCanvas.height, (e.clientY - rect.top) * (cropCanvas.height / rect.height)));
      cropBox.x = Math.min(cropDragStart.x, x);
      cropBox.y = Math.min(cropDragStart.y, y);
      cropBox.w = Math.abs(x - cropDragStart.x);
      cropBox.h = Math.abs(y - cropDragStart.y);
      drawCropCanvas();
    });

    window.addEventListener('pointerup', () => {
      if (isCroppingDrag) {
        isCroppingDrag = false;
        if (cropBox.w < 10 || cropBox.h < 10) {
          cropBox = { x: 0, y: 0, w: cropCanvas.width, h: cropCanvas.height };
          drawCropCanvas();
        }
      }
    });

    btnCropFull.addEventListener('click', () => {
      cropBox = { x: 0, y: 0, w: cropCanvas.width, h: cropCanvas.height };

    function colorDist(r1, g1, b1, r2, g2, b2) {
      const rmean = (r1 + r2) / 2;
      const dr = r1 - r2;
      const dg = g1 - g2;
      const db = b1 - b2;
      return Math.sqrt((2 + rmean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rmean) / 256) * db * db);
    }

    function findNearestColor(r, g, b, palette) {
      let minDist = Infinity;
      let matched = palette[0];
      for (const item of palette) {
        const dist = colorDist(r, g, b, item.r, item.g, item.b);
        if (dist < minDist) {
          minDist = dist;
          matched = item;
        }
      }
      return matched;
    }

    // 泛洪背景提取
    function computeBackgroundMask(imgData, width, height, autoBg, tolerance) {
      const isBg = new Uint8Array(width * height);
      const queue = [];
      for (let i = 0; i < width * height; i++) {
        if (imgData[i * 4 + 3] < 40) {
          isBg[i] = 1;
          queue.push([i % width, Math.floor(i / width)]);
        }
      }

      if (!autoBg) return isBg;

      const samplePoints = [
        [0, 0], [width - 1, 0], [0, height - 1], [width - 1, height - 1],
        [Math.floor(width / 2), 0], [Math.floor(width / 2), height - 1],
        [0, Math.floor(height / 2)], [width - 1, Math.floor(height / 2)]
      ];

      const seedColors = [];
      for (const [sx, sy] of samplePoints) {
        const pIdx = (sy * width + sx) * 4;
        if (imgData[pIdx + 3] >= 40) {
          const sr = imgData[pIdx];
          const sg = imgData[pIdx + 1];
          const sb = imgData[pIdx + 2];
          const exists = seedColors.some(s => colorDist(sr, sg, sb, s.r, s.g, s.b) < 18);
          if (!exists) {
            seedColors.push({ r: sr, g: sg, b: sb });
          }
        }
      }

      function isColorMatchSeed(r, g, b, tol) {
        for (const s of seedColors) {
          if (colorDist(r, g, b, s.r, s.g, s.b) <= tol) return true;
        }
        return false;
      }

      for (let x = 0; x < width; x++) {
        let idx = x;
        if (!isBg[idx] && isColorMatchSeed(imgData[idx * 4], imgData[idx * 4 + 1], imgData[idx * 4 + 2], tolerance)) {
          isBg[idx] = 1;
          queue.push([x, 0]);
        }
        idx = (height - 1) * width + x;
        if (!isBg[idx] && isColorMatchSeed(imgData[idx * 4], imgData[idx * 4 + 1], imgData[idx * 4 + 2], tolerance)) {
          isBg[idx] = 1;
          queue.push([x, height - 1]);
        }
      }

      for (let y = 0; y < height; y++) {
        let idx = y * width;
        if (!isBg[idx] && isColorMatchSeed(imgData[idx * 4], imgData[idx * 4 + 1], imgData[idx * 4 + 2], tolerance)) {
          isBg[idx] = 1;
          queue.push([0, y]);
        }
        idx = y * width + (width - 1);
        if (!isBg[idx] && isColorMatchSeed(imgData[idx * 4], imgData[idx * 4 + 1], imgData[idx * 4 + 2], tolerance)) {
          isBg[idx] = 1;
          queue.push([width - 1, y]);
        }
      }

      let head = 0;
      while (head < queue.length) {
        const [cx, cy] = queue[head++];
        const neighbors = [
          [cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]
        ];

        for (const [nx, ny] of neighbors) {
          if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
            const nIdx = ny * width + nx;
            if (!isBg[nIdx]) {
              const na = imgData[nIdx * 4 + 3];
              if (na < 40) {
                isBg[nIdx] = 1;
                queue.push([nx, ny]);
              } else {
                const nr = imgData[nIdx * 4];
                const ng = imgData[nIdx * 4 + 1];
                const nb = imgData[nIdx * 4 + 2];
                if (isColorMatchSeed(nr, ng, nb, tolerance)) {
                  isBg[nIdx] = 1;
                  queue.push([nx, ny]);
                }
              }
            }
          }
        }
      }

      return isBg;
    }

    // 孤立杂色平滑合并算法 (BFS 连通域)
    function smoothNoisePixels(grid, threshold) {
      if (!threshold || threshold <= 0) return grid;
      const h = grid.length;
      const w = grid[0].length;
      const newGrid = grid.map(row => [...row]);
      const visited = Array(h).fill(null).map(() => Array(w).fill(false));

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (visited[y][x] || !newGrid[y][x]) continue;

          const targetCode = newGrid[y][x].code;
          const component = [];
          const queue = [[x, y]];
          visited[y][x] = true;
          const neighborColors = [];

          while (queue.length > 0) {
            const [cx, cy] = queue.shift();
            component.push([cx, cy]);

            const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
            for (const [dx, dy] of dirs) {
              const nx = cx + dx;
              const ny = cy + dy;
              if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                const nbBead = newGrid[ny][nx];
                if (nbBead && nbBead.code === targetCode) {
                  if (!visited[ny][nx]) {
                    visited[ny][nx] = true;
                    queue.push([nx, ny]);
                  }
                } else if (nbBead) {
                  neighborColors.push(nbBead);
                }
              }
            }
          }

          if (component.length <= threshold && neighborColors.length > 0) {
            const freqMap = new Map();
            for (const b of neighborColors) {
              freqMap.set(b, (freqMap.get(b) || 0) + 1);
            }
            let maxCount = 0;
            let dominantBead = null;
            for (const [bead, count] of freqMap.entries()) {
              if (count > maxCount) {
                maxCount = count;
                dominantBead = bead;
              }
            }
            if (dominantBead) {
              for (const [px, py] of component) {
                newGrid[py][px] = dominantBead;
              }
            }
          }
        }
      }
      return newGrid;
    }

    // 色数上限硬性控制算法
    function applyColorCountLimit(grid, maxColors, activePalette) {
      if (!maxColors || maxColors <= 0) return grid;
      const countMap = new Map();
      for (const row of grid) {
        for (const b of row) {
          if (b) countMap.set(b.code, (countMap.get(b.code) || 0) + 1);
        }
      }
      if (countMap.size <= maxColors) return grid;

      const sorted = Array.from(countMap.entries()).sort((a, b) => b[1] - a[1]);
      const allowedCodes = new Set(sorted.slice(0, maxColors).map(e => e[0]));
      const allowedPalette = activePalette.filter(p => allowedCodes.has(p.code));

      return grid.map(row => row.map(bead => {
        if (!bead) return null;
        if (allowedCodes.has(bead.code)) return bead;
        return findNearestColor(bead.r, bead.g, bead.b, allowedPalette);
      }));
    }

    // 二维码绘制
    function drawQRCodeOnCanvas(ctx, text, x, y, size) {
      try {
        let qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const count = qr.getModuleCount();
        const cellSize = size / count;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x - 8, y - 8, size + 16, size + 16);

        ctx.fillStyle = '#000000';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(x + c * cellSize, y + r * cellSize, Math.ceil(cellSize), Math.ceil(cellSize));
            }
          }
        }
      } catch (err) {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x - 8, y - 8, size + 16, size + 16);
      }
    }

    // 核心转换管线
    function processImage() {
      if (!currentImg) return;
      statusText.textContent = '正在实时渲染拼豆图纸...';

      const targetWidth = parseInt(boardWidthInput.value, 10);
      const aspectRatio = (currentImg.naturalHeight || currentImg.height) / (currentImg.naturalWidth || currentImg.width);
      const targetHeight = Math.max(1, Math.round(targetWidth * aspectRatio));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = targetWidth;
      offCanvas.height = targetHeight;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = false;

      const bVal = 100 + parseInt(brightnessRange.value, 10);
      const cVal = 100 + parseInt(contrastRange.value, 10);
      const sVal = 100 + parseInt(saturateRange.value, 10);
      offCtx.filter = `brightness(${bVal}%) contrast(${cVal}%) saturate(${sVal}%)`;

      offCtx.drawImage(currentImg, 0, 0, targetWidth, targetHeight);

      const imgData = offCtx.getImageData(0, 0, targetWidth, targetHeight).data;
      const autoBg = bgToggle.checked;
      const tolerance = parseInt(bgTolerance.value, 10);
      const fullPalette = PALETTES[paletteSelect.value] || PALETTES.standard72;

      // 剔除已排除色号
      let activePalette = fullPalette.filter(p => !excludedColorCodes.has(p.code));
      if (activePalette.length === 0) {
        activePalette = fullPalette;
        excludedColorCodes.clear();
      }

      const bgMask = computeBackgroundMask(imgData, targetWidth, targetHeight, autoBg, tolerance);

      let initialGrid = [];
      for (let y = 0; y < targetHeight; y++) {
        const row = [];
        for (let x = 0; x < targetWidth; x++) {
          const idx = y * targetWidth + x;
          const p4 = idx * 4;

          if (bgMask[idx] === 1) {
            row.push(null);
          } else {
            const r = imgData[p4];
            const g = imgData[p4 + 1];
            const b = imgData[p4 + 2];
            const bead = findNearestColor(r, g, b, activePalette);
            row.push(bead);
          }
        }
        initialGrid.push(row);
      }

      // 执行杂色平滑
      const noiseLimit = parseInt(noiseThresholdInput.value, 10);
      let processedGrid = smoothNoisePixels(initialGrid, noiseLimit);

      // 执行色数上限限制
      const maxColors = parseInt(maxColorSelect.value, 10);
      gridData = applyColorCountLimit(processedGrid, maxColors, activePalette);

      // 统计用量
      currentStatsMap = {};
      for (let y = 0; y < targetHeight; y++) {
        for (let x = 0; x < targetWidth; x++) {
          const bead = gridData[y][x];
          if (bead) {
            currentStatsMap[bead.code] = currentStatsMap[bead.code] || { ...bead, count: 0 };
            currentStatsMap[bead.code].count += 1;
          }
        }
      }

      renderCanvases(currentStatsMap);
      renderStats(currentStatsMap);
      statusText.textContent = `生成成功：${targetWidth} × ${targetHeight} 网格 (${Object.keys(currentStatsMap).length} 种颜色，共 ${Object.values(currentStatsMap).reduce((a, b) => a + b.count, 0)} 颗)`;
    }

    // 绘制双画布
    function renderCanvases(statsMap = {}) {
      if (gridData.length === 0) return;
      const height = gridData.length;
      const width = gridData[0].length;

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const canvasBg = isDark ? '#0f172a' : '#ffffff';
      const gridLine = isDark ? '#1e293b' : '#f1f5f9';
      const cellSize = 30;

      const pegboardSize = parseInt(pegboardSelect.value, 10);

      // 1. 左侧纯色实体拼豆预览
      boardCanvas.width = width * cellSize;
      boardCanvas.height = height * cellSize;
      const bCtx = boardCanvas.getContext('2d');
      bCtx.fillStyle = canvasBg;
      bCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = x * cellSize;
          const cy = y * cellSize;

          bCtx.strokeStyle = gridLine;
          bCtx.lineWidth = 1;
          bCtx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = gridData[y][x];
          if (bead) {
            const centerX = cx + cellSize / 2;
            const centerY = cy + cellSize / 2;
            const radius = cellSize * 0.44;

            bCtx.save();
            if (activeHighlightCode && bead.code !== activeHighlightCode) {
              bCtx.globalAlpha = 0.18;
            }

            bCtx.beginPath();
            bCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            bCtx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
            bCtx.fill();
            bCtx.lineWidth = 1;
            bCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
            bCtx.stroke();
            bCtx.restore();
          }
        }
      }

      // 2. 右侧色号对照图纸
      const ruler = 32;
      const gridPixelW = width * cellSize;
      const gridPixelH = height * cellSize;

      const minCanvasW = 720;
      const canvasW = Math.max(minCanvasW, gridPixelW + ruler + 40);
      const startX = Math.floor((canvasW - (gridPixelW + ruler)) / 2) + ruler;
      const startY = ruler;
      const bannerY = gridPixelH + ruler + 20;
      const bannerHeight = 150;

      schematicCanvas.width = canvasW;
      schematicCanvas.height = bannerY + bannerHeight;
      const sCtx = schematicCanvas.getContext('2d');

      sCtx.fillStyle = canvasBg;
      sCtx.fillRect(0, 0, canvasW, bannerY);

      sCtx.fillStyle = isDark ? '#94a3b8' : '#64748b';
      sCtx.font = 'bold 11px monospace';
      sCtx.textAlign = 'center';
      sCtx.textBaseline = 'middle';

      for (let x = 0; x < width; x++) {
        sCtx.fillText((x + 1).toString(), startX + x * cellSize + cellSize / 2, startY / 2);
      }
      for (let y = 0; y < height; y++) {
        sCtx.fillText((y + 1).toString(), startX - ruler / 2, startY + y * cellSize + cellSize / 2);
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = startX + x * cellSize;
          const cy = startY + y * cellSize;

          sCtx.strokeStyle = gridLine;
          sCtx.lineWidth = 1;
          sCtx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = gridData[y][x];
          if (bead) {
            const centerX = cx + cellSize / 2;
            const centerY = cy + cellSize / 2;
            const radius = cellSize * 0.44;

            sCtx.save();
            const isMatch = !activeHighlightCode || bead.code === activeHighlightCode;
            if (!isMatch) {
              sCtx.globalAlpha = 0.16;
            }

            sCtx.beginPath();
            sCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            sCtx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
            sCtx.fill();
            sCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
            sCtx.stroke();

            const lum = 0.299 * (bead.r || 100) + 0.587 * (bead.g || 100) + 0.114 * (bead.b || 100);
            sCtx.font = `bold 10px monospace`;
            sCtx.textAlign = 'center';
            sCtx.textBaseline = 'middle';
            sCtx.fillStyle = lum > 140 ? '#000000' : '#ffffff';
            sCtx.fillText(bead.code, centerX, centerY);

            if (checkedBeadCoords.has(`${x},${y}`)) {
              sCtx.strokeStyle = '#10b981';
              sCtx.lineWidth = 3;
              sCtx.beginPath();
              sCtx.moveTo(cx + 4, cy + 4);
              sCtx.lineTo(cx + cellSize - 4, cy + cellSize - 4);
              sCtx.stroke();
            }

            sCtx.restore();
          }
        }
      }

      // 拼豆板拼接线绘制
      if (pegboardSize > 0) {
        sCtx.save();
        sCtx.strokeStyle = '#2563eb';
        sCtx.lineWidth = 2.5;
        sCtx.setLineDash([6, 4]);

        for (let bx = pegboardSize; bx < width; bx += pegboardSize) {
          const px = startX + bx * cellSize;
          sCtx.beginPath();
          sCtx.moveTo(px, startY);
          sCtx.lineTo(px, startY + gridPixelH);
          sCtx.stroke();
        }

        for (let by = pegboardSize; by < height; by += pegboardSize) {
          const py = startY + by * cellSize;
          sCtx.beginPath();
          sCtx.moveTo(startX, py);
          sCtx.lineTo(startX + gridPixelW, py);
          sCtx.stroke();
        }

        sCtx.fillStyle = '#2563eb';
        sCtx.font = 'bold 12px sans-serif';
        sCtx.textAlign = 'left';
        sCtx.textBaseline = 'top';
        let bIdxY = 0;
        for (let by = 0; by < height; by += pegboardSize) {
          let bIdxX = 0;
          for (let bx = 0; bx < width; bx += pegboardSize) {
            const tagX = startX + bx * cellSize + 4;
            const tagY = startY + by * cellSize + 4;
            const label = `板 ${String.fromCharCode(65 + bIdxY)}${bIdxX + 1}`;
            sCtx.fillText(label, tagX, tagY);
            bIdxX++;
          }
          bIdxY++;
        }
        sCtx.restore();
      }

      // 底部专属横幅
      sCtx.fillStyle = '#0f172a';
      sCtx.fillRect(0, bannerY, canvasW, bannerHeight);

      sCtx.strokeStyle = '#2563eb';
      sCtx.lineWidth = 3;
      sCtx.beginPath();
      sCtx.moveTo(0, bannerY);
      sCtx.lineTo(canvasW, bannerY);
      sCtx.stroke();

      const qrSize = 104;
      const qrX = canvasW - qrSize - 36;
      const qrY = bannerY + (bannerHeight - qrSize) / 2;
      drawQRCodeOnCanvas(sCtx, 'https://pindouwang.pages.dev', qrX, qrY, qrSize);

      const textX = 32;
      sCtx.textAlign = 'left';
      sCtx.textBaseline = 'middle';

      sCtx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      sCtx.fillStyle = '#ffffff';
      sCtx.fillText('Micheal 的拼豆网 · 在线设计工坊', textX, bannerY + 40);

      sCtx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      sCtx.fillStyle = '#94a3b8';
      sCtx.fillText('标准 A-H/M 拼豆色号图纸 · 手机扫码可直接载入与导出', textX, bannerY + 76);

      const totalBeads = Object.values(statsMap).reduce((acc, cur) => acc + (cur.count || 0), 0);
      const colorKindCount = Object.keys(statsMap).length;
      sCtx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      sCtx.fillStyle = '#38bdf8';
      sCtx.fillText(`规格：${width} × ${height} 网格   用色：${colorKindCount} 色 / 共 ${totalBeads} 颗`, textX, bannerY + 112);
    }

    // 交互点击事件：打卡与同色高亮
    function handleCanvasInteract(clientX, clientY) {
      if (gridData.length === 0) return;
      const height = gridData.length;
      const width = gridData[0].length;
      const cellSize = 30;
      const ruler = 32;

      const rect = schematicCanvas.getBoundingClientRect();
      const scaleX = schematicCanvas.width / rect.width;
      const scaleY = schematicCanvas.height / rect.height;
      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const minCanvasW = 720;
      const gridPixelW = width * cellSize;
      const canvasW = Math.max(minCanvasW, gridPixelW + ruler + 40);
      const startX = Math.floor((canvasW - (gridPixelW + ruler)) / 2) + ruler;
      const startY = ruler;

      if (canvasX < startX || canvasX >= startX + gridPixelW || canvasY < startY || canvasY >= startY + height * cellSize) {
        return;
      }

      const gx = Math.floor((canvasX - startX) / cellSize);
      const gy = Math.floor((canvasY - startY) / cellSize);
      const targetBead = gridData[gy][gx];
      if (!targetBead) return;

      if (markModeToggle.checked) {
        const key = `${gx},${gy}`;
        if (checkedBeadCoords.has(key)) {
          checkedBeadCoords.delete(key);
        } else {
          checkedBeadCoords.add(key);
        }
        renderCanvases(currentStatsMap);
      } else {
        if (activeHighlightCode === targetBead.code) {
          activeHighlightCode = null;
        } else {
          activeHighlightCode = targetBead.code;
        }
        renderCanvases(currentStatsMap);
        renderStats(currentStatsMap);
      }
    }

    schematicCanvas.addEventListener('click', (e) => handleCanvasInteract(e.clientX, e.clientY));

    // 4K 超清导出
    function generateUltraHDPNG() {
      if (gridData.length === 0) return null;
      const height = gridData.length;
      const width = gridData[0].length;

      const cellSize = 60;
      const ruler = 64;
      const gridPixelW = width * cellSize;
      const gridPixelH = height * cellSize;

      const minExportW = 1440;
      const canvasW = Math.max(minExportW, gridPixelW + ruler + 80);
      const startX = Math.floor((canvasW - (gridPixelW + ruler)) / 2) + ruler;
      const startY = ruler;

      const bannerY = gridPixelH + ruler + 40;
      const bannerHeight = 260;

      const hdCanvas = document.createElement('canvas');
      hdCanvas.width = canvasW;
      hdCanvas.height = bannerY + bannerHeight;
      const ctx = hdCanvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvasW, bannerY);

      ctx.fillStyle = '#475569';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let x = 0; x < width; x++) {
        ctx.fillText((x + 1).toString(), startX + x * cellSize + cellSize / 2, startY / 2);
      }
      for (let y = 0; y < height; y++) {
        ctx.fillText((y + 1).toString(), startX - ruler / 2, startY + y * cellSize + cellSize / 2);
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = startX + x * cellSize;
          const cy = startY + y * cellSize;

          ctx.strokeStyle = '#E2E8F0';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = gridData[y][x];
          if (bead) {
            const centerX = cx + cellSize / 2;
            const centerY = cy + cellSize / 2;
            const radius = cellSize * 0.45;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
            ctx.fill();

            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.stroke();

            const lum = 0.299 * (bead.r || 100) + 0.587 * (bead.g || 100) + 0.114 * (bead.b || 100);
            ctx.font = `bold 20px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = lum > 140 ? '#000000' : '#FFFFFF';
            ctx.fillText(bead.code, centerX, centerY);
          }
        }
      }

      // 导出拼豆板分割线
      const pegboardSize = parseInt(pegboardSelect.value, 10);
      if (pegboardSize > 0) {
        ctx.save();
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 4;
        ctx.setLineDash([12, 8]);
        for (let bx = pegboardSize; bx < width; bx += pegboardSize) {
          const px = startX + bx * cellSize;
          ctx.beginPath();
          ctx.moveTo(px, startY);
          ctx.lineTo(px, startY + gridPixelH);
          ctx.stroke();
        }
        for (let by = pegboardSize; by < height; by += pegboardSize) {
          const py = startY + by * cellSize;
          ctx.beginPath();
          ctx.moveTo(startX, py);
          ctx.lineTo(startX + gridPixelW, py);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.fillStyle = '#0F172A';
      ctx.fillRect(0, bannerY, canvasW, bannerHeight);

      ctx.strokeStyle = '#2563EB';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, bannerY);
      ctx.lineTo(canvasW, bannerY);
      ctx.stroke();

      const qrSize = 190;
      const qrX = canvasW - qrSize - 60;
      const qrY = bannerY + (bannerHeight - qrSize) / 2;
      drawQRCodeOnCanvas(ctx, 'https://pindouwang.pages.dev', qrX, qrY, qrSize);

      const textX = 56;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('Micheal 的拼豆网 · 在线设计工坊', textX, bannerY + 70);

      ctx.font = '22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.fillText('标准 A-H/M 拼豆色号图纸 · 手机扫码可直接载入与导出', textX, bannerY + 135);

      const totalBeads = Object.values(currentStatsMap).reduce((acc, cur) => acc + (cur.count || 0), 0);
      const colorKindCount = Object.keys(currentStatsMap).length;
      ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#38BDF8';
      ctx.fillText(`规格：${width} × ${height} 网格   用色：${colorKindCount} 色 / 共 ${totalBeads} 颗`, textX, bannerY + 195);

      return hdCanvas;
    }

    const observer = new MutationObserver(() => {
      if (gridData.length > 0) processImage();
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    // 渲染材料统计表与功能交互 (同色高亮与排除重映射)
    function renderStats(statsMap) {
      const items = Object.values(statsMap).sort((a, b) => b.count - a.count);
      if (items.length === 0) {
        statsContainer.innerHTML = '';
        return;
      }
      let total = items.reduce((sum, item) => sum + item.count, 0);
      let html = `
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px;">
          <h3 style="color: var(--text-main); margin: 0;">所需材料用量清单 (共使用 ${items.length} 种颜色，${total} 颗拼豆)</h3>
          ${activeHighlightCode ? `<button id="btn-cancel-hl" class="btn" style="padding: 4px 10px; font-size: 12px;">取消高亮聚焦</button>` : ''}
        </div>
        <table class="stats-table">
          <thead>
            <tr>
              <th>色号</th>
              <th>颜色</th>
              <th>名称</th>
              <th>所需数量</th>
              <th>聚焦</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
      `;
      for (const item of items) {
        const isExcluded = excludedColorCodes.has(item.code);
        const isHl = activeHighlightCode === item.code;
        html += `
          <tr class="${isHl ? 'is-highlighted' : ''} ${isExcluded ? 'is-excluded' : ''}" data-code="${item.code}">
            <td><strong>${item.code}</strong></td>
            <td><span class="color-chip" style="background: ${item.hex || `rgb(${item.r},${item.g},${item.b})`};"></span></td>
            <td>${item.name || item.code}</td>
            <td>${item.count} 颗</td>
            <td>
              <button class="btn btn-focus-color" data-code="${item.code}" type="button" style="padding: 2px 8px; font-size: 12px;">
                ${isHl ? '取消' : '高亮'}
              </button>
            </td>
            <td>
              <button class="btn btn-toggle-exclude" data-code="${item.code}" type="button" style="padding: 2px 8px; font-size: 12px;">
                ${isExcluded ? '恢复' : '排除'}
              </button>
            </td>
          </tr>
        `;
      }
      html += '</tbody></table>';
      statsContainer.innerHTML = html;

      // 绑定表格操作按钮
      document.getElementById('btn-cancel-hl')?.addEventListener('click', () => {
        activeHighlightCode = null;
        renderCanvases(currentStatsMap);
        renderStats(currentStatsMap);
      });

      document.querySelectorAll('.btn-focus-color').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const code = btn.dataset.code;
          activeHighlightCode = (activeHighlightCode === code) ? null : code;
          renderCanvases(currentStatsMap);
          renderStats(currentStatsMap);
        });
      });

      document.querySelectorAll('.btn-toggle-exclude').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const code = btn.dataset.code;
          if (excludedColorCodes.has(code)) {
            excludedColorCodes.delete(code);
          } else {
            excludedColorCodes.add(code);
          }
          processImage();
        });
      });
    }

    exportPngBtn.addEventListener('click', () => {
      if (gridData.length === 0) return alert('请先生成或选择拼豆图纸！');
      const hdCanvas = generateUltraHDPNG();
      if (!hdCanvas) return;
      const link = document.createElement('a');
      link.download = `Micheal-Beads-Pattern-UltraHD.png`;
      link.href = hdCanvas.toDataURL('image/png');
      link.click();
    });

    exportCsvBtn.addEventListener('click', () => {
      if (gridData.length === 0) return alert('请先生成或选择拼豆图纸！');
      const height = gridData.length;
      const width = gridData[0].length;

      let csv = '\uFEFF行号\\列号,' + Array.from({ length: width }, (_, i) => `第${i + 1}列`).join(',') + '\n';
      for (let y = 0; y < height; y++) {
        const rowData = [`第${y + 1}行`];
        for (let x = 0; x < width; x++) {
          const bead = gridData[y][x];
          rowData.push(bead ? `"${bead.code}"` : '""');
        }
        csv += rowData.join(',') + '\n';
      }

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Micheal-Beads-GridMatrix-${width}x${height}.csv`;
      link.click();
    });
  </script>
</body>
</html>
