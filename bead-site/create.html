<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作 · Micheal 的拼豆网</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <style>
    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .canvas-row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 20px;
    }
    .canvas-box {
      flex: 1 1 480px;
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
      max-height: 750px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-label {
      font-weight: 600;
      margin-bottom: 12px;
      color: #374151;
      align-self: flex-start;
    }
    .board-canvas, .preview-canvas {
      max-width: 100%;
      height: auto;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border-radius: 6px;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid #e5e7eb;
      padding: 8px 12px;
      text-align: center;
    }
    .stats-table th {
      background: #f3f4f6;
    }
    .color-chip {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(0,0,0,0.18);
    }
    .export-row {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }
    .btn-lg {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section id="upload-section" class="upload-section">
      <h2>上传图片，自动生成拼豆图纸</h2>
      <div class="control-row">
        <label class="upload-btn btn btn-primary" style="cursor: pointer;">
          📁 上传图片 / 更换图片
          <input id="upload-input" type="file" accept="image/*,.gif" hidden />
        </label>
        <label class="wb-check" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <input id="bg-toggle" type="checkbox" /> 自动抠除白色/透明背景
        </label>
        <div class="control" style="display: flex; align-items: center; gap: 8px;">
          <label>板宽（横向拼豆数）：<span id="board-width-val">30</span></label>
          <input id="board-width" type="range" min="10" max="100" step="1" value="30" />
        </div>
        <label class="wb-check" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <input id="labels-toggle" type="checkbox" checked /> 标注色号
        </label>
        <label class="wb-check" style="display: flex; align-items: center; gap: 6px;">
          选色板：
          <select id="palette-select" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db;">
            <option value="artkal">Artkal 常用标准 50 色</option>
            <option value="perler">Perler 经典常用色系</option>
            <option value="hama">Hama 拼豆精选色系</option>
            <option value="retro">复古像素 16 色 (GameBoy/Pixel)</option>
          </select>
        </label>
      </div>

      <p id="convert-status" class="ai-status" style="color: #4b5563; font-weight: 500;"></p>

      <div class="canvas-row">
        <div class="canvas-box">
          <span class="canvas-label">拼豆高清网格图纸（高对比度色号）</span>
          <canvas id="board-canvas" class="board-canvas"></canvas>
        </div>
        <div class="canvas-box">
          <span class="canvas-label">像素原图预览</span>
          <canvas id="preview-canvas" class="preview-canvas"></canvas>
        </div>
      </div>

      <!-- 用色统计 -->
      <div class="stats" id="stats"></div>

      <!-- 导出选项 -->
      <div class="export-row">
        <button id="export-png" class="btn btn-primary btn-lg" type="button">✨ 导出超清图纸 (Ultra-HD PNG)</button>
        <button id="export-csv" class="btn btn-lg" type="button">📊 导出用色清单 (CSV)</button>
      </div>
    </section>

    <!-- 更多玩法 -->
    <section class="tool-section">
      <h2>更多玩法</h2>
      <div class="entry-cards">
        <div class="entry-card">
          <h3>从白板开始</h3>
          <p>打开像素画板，自由绘制并实时统计用色，支持画笔 / 橡皮 / 油漆桶 / 镜像 / 撤销。</p>
          <a href="whiteboard.html" class="btn btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">打开白板编辑器</a>
        </div>
      </div>
    </section>
  </main>

        { code: 'R06', name: 'GB草绿', r: 48, g: 98, b: 48 },

        { code: 'R08', name: 'GB嫩黄', r: 155, g: 188, b: 15 },

    let currentImg = null;
    let gridData = [];

    const uploadInput = document.getElementById('upload-input');
    const bgToggle = document.getElementById('bg-toggle');
    const boardWidthInput = document.getElementById('board-width');
    const boardWidthVal = document.getElementById('board-width-val');
    const labelsToggle = document.getElementById('labels-toggle');
    const paletteSelect = document.getElementById('palette-select');
    const statusText = document.getElementById('convert-status');
    const boardCanvas = document.getElementById('board-canvas');
    const previewCanvas = document.getElementById('preview-canvas');
    const statsContainer = document.getElementById('stats');
    const exportPngBtn = document.getElementById('export-png');
    const exportCsvBtn = document.getElementById('export-csv');

    // 监听所有输入变动，全部实现无缝自动转换
    boardWidthInput.addEventListener('input', (e) => {
      boardWidthVal.textContent = e.target.value;
      if (currentImg) processImage();
    });

    labelsToggle.addEventListener('change', () => {
      if (gridData.length > 0) renderCanvases();
    });

    bgToggle.addEventListener('change', () => {
      if (currentImg) processImage();
    });

    paletteSelect.addEventListener('change', () => {
      if (currentImg) processImage();
    });

    // 监听图片上传
    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          currentImg = img;
          processImage();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 颜色距离匹配算法（CIELAB 加权近似）
    function findNearestColor(r, g, b, palette) {
      let minDist = Infinity;
      let matched = palette[0];
      for (const item of palette) {
        const rmean = (r + item.r) / 2;
        const dr = r - item.r;
        const dg = g - item.g;
        const db = b - item.b;
        const dist = (2 + rmean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rmean) / 256) * db * db;
        if (dist < minDist) {
          minDist = dist;
          matched = item;
        }
      }
      return matched;
    }

    // 图片处理转拼豆核心逻辑
    function processImage() {
      if (!currentImg) return;
      statusText.style.color = '#4b5563';
      statusText.textContent = '正在实时生成高对比拼豆图纸...';

      const targetWidth = parseInt(boardWidthInput.value, 10);
      const aspectRatio = currentImg.height / currentImg.width;
      const targetHeight = Math.max(1, Math.round(targetWidth * aspectRatio));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = targetWidth;
      offCanvas.height = targetHeight;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(currentImg, 0, 0, targetWidth, targetHeight);

      const imgData = offCtx.getImageData(0, 0, targetWidth, targetHeight).data;
      const autoBg = bgToggle.checked;
      const activePalette = PALETTES[paletteSelect.value] || PALETTES.artkal;

      gridData = [];
      const statsMap = {};

      for (let y = 0; y < targetHeight; y++) {
        const row = [];
        for (let x = 0; x < targetWidth; x++) {
          const idx = (y * targetWidth + x) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const a = imgData[idx + 3];

          if (a < 50 || (autoBg && r > 235 && g > 235 && b > 235)) {
            row.push(null);
          } else {
            const bead = findNearestColor(r, g, b, activePalette);
            row.push(bead);
            statsMap[bead.code] = statsMap[bead.code] || { ...bead, count: 0 };
            statsMap[bead.code].count += 1;
          }
        }
        gridData.push(row);
      }

      renderCanvases();
      renderStats(statsMap);
      statusText.textContent = `完成：${targetWidth} × ${targetHeight} 网格 (${activePalette.length} 色预设)`;
    }

    // 绘制拼豆颗粒与高对比度文字
    function drawBeadCell(ctx, bead, cx, cy, cellSize, showLabels) {
      const centerX = cx + cellSize / 2;
      const centerY = cy + cellSize / 2;
      const radius = cellSize * 0.44;

      // 1. 拼豆主体
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${bead.r},${bead.g},${bead.b})`;
      ctx.fill();
      ctx.lineWidth = Math.max(1, cellSize * 0.04);
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.stroke();

      // 2. 中间小孔
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.stroke();

      // 3. 高对比度标注色号（加入描边与微胶囊底色，确保 100% 清晰）
      if (showLabels) {
        const fontSize = Math.max(8, Math.floor(cellSize * 0.34));
        ctx.font = `bold ${fontSize}px "SF Pro", -apple-system, monospace, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // 依据 WCAG 标准计算亮度
        const lum = 0.2126 * bead.r + 0.7152 * bead.g + 0.0722 * bead.b;
        const isBright = lum > 145;

        // 文字背部描边对比层
        ctx.lineWidth = Math.max(2, fontSize * 0.25);
        ctx.strokeStyle = isBright ? '#ffffff' : '#000000';
        ctx.strokeText(bead.code, centerX, centerY);

        // 文字主体
        ctx.fillStyle = isBright ? '#000000' : '#ffffff';
        ctx.fillText(bead.code, centerX, centerY);
      }
    }

    // 页面内渲染
    function renderCanvases() {
      if (gridData.length === 0) return;
      const height = gridData.length;
      const width = gridData[0].length;

      // 像素预览
      const pixelSize = 8;
      previewCanvas.width = width * pixelSize;
      previewCanvas.height = height * pixelSize;
      const pCtx = previewCanvas.getContext('2d');
      pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const bead = gridData[y][x];
          if (bead) {
            pCtx.fillStyle = `rgb(${bead.r},${bead.g},${bead.b})`;
            pCtx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
          }
        }
      }

      // 拼豆网格板
      const cellSize = 32;
      boardCanvas.width = width * cellSize;
      boardCanvas.height = height * cellSize;
      const bCtx = boardCanvas.getContext('2d');
      bCtx.fillStyle = '#f8fafc';
      bCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

      const showLabels = labelsToggle.checked;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = x * cellSize;
          const cy = y * cellSize;

          bCtx.strokeStyle = '#e2e8f0';
          bCtx.lineWidth = 1;
          bCtx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = gridData[y][x];
          if (bead) {
            drawBeadCell(bCtx, bead, cx, cy, cellSize, showLabels);
          }
        }
      }
    }

    // 统计用色
    function renderStats(statsMap) {
      const items = Object.values(statsMap).sort((a, b) => b.count - a.count);
      if (items.length === 0) {
        statsContainer.innerHTML = '';
        return;
      }

      let total = items.reduce((sum, item) => sum + item.count, 0);
      let html = `
        <h3>🎨 用色清单 (共使用 ${items.length} 种颜色，${total} 颗拼豆)</h3>
        <table class="stats-table">
          <thead>
            <tr><th>色号</th><th>颜色</th><th>名称</th><th>所需数量</th></tr>
          </thead>
          <tbody>
      `;
      for (const item of items) {
        html += `
          <tr>
            <td><strong>${item.code}</strong></td>
            <td><span class="color-chip" style="background: rgb(${item.r},${item.g},${item.b});"></span></td>
            <td>${item.name}</td>
            <td>${item.count} 颗</td>
          </tr>
        `;
      }
      html += '</tbody></table>';
      statsContainer.innerHTML = html;
    }

    // 导出超清 PNG（采用独立 64px 大尺寸单元格 + 坐标轴刻度尺）
    exportPngBtn.addEventListener('click', () => {
      if (gridData.length === 0) return alert('请先上传图片生成拼豆图纸！');

      const height = gridData.length;
      const width = gridData[0].length;
      const cellSize = 64; // 超高清单元格分辨率
      const rulerSize = 40; // 顶部与左侧坐标尺区域

      const hdCanvas = document.createElement('canvas');
      hdCanvas.width = width * cellSize + rulerSize;
      hdCanvas.height = height * cellSize + rulerSize;
      const ctx = hdCanvas.getContext('2d');

      // 背景底色
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, hdCanvas.width, hdCanvas.height);

      // 绘制标尺文字样式
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 顶部 X 轴刻度
      for (let x = 0; x < width; x++) {
        const posX = rulerSize + x * cellSize + cellSize / 2;
        ctx.fillText((x + 1).toString(), posX, rulerSize / 2);
      }

      // 左侧 Y 轴刻度
      for (let y = 0; y < height; y++) {
        const posY = rulerSize + y * cellSize + cellSize / 2;
        ctx.fillText((y + 1).toString(), rulerSize / 2, posY);
      }

      // 标尺分割线
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rulerSize, 0);
      ctx.lineTo(rulerSize, hdCanvas.height);
      ctx.moveTo(0, rulerSize);
      ctx.lineTo(hdCanvas.width, rulerSize);
      ctx.stroke();

      // 绘制超清网格与豆豆
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const cx = rulerSize + x * cellSize;
          const cy = rulerSize + y * cellSize;

          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(cx, cy, cellSize, cellSize);

          // 逢 5 格与 10 格加粗辅助线，方便拼装定位
          if ((x + 1) % 5 === 0) {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.strokeRect(cx, cy, cellSize, cellSize);
          }

          const bead = gridData[y][x];
          if (bead) {
            drawBeadCell(ctx, bead, cx, cy, cellSize, true);
          }
        }
      }

      const link = document.createElement('a');
      link.download = `Micheal-Beads-UltraHD-${width}x${height}.png`;
      link.href = hdCanvas.toDataURL('image/png', 1.0);
      link.click();
    });

    // 导出 CSV
    exportCsvBtn.addEventListener('click', () => {
      if (gridData.length === 0) return alert('请先生成拼豆图纸！');
      let csv = '\uFEFF色号,颜色名称,所需颗粒数\n';
      const statsMap = {};
      gridData.flat().filter(Boolean).forEach(b => {
        statsMap[b.code] = statsMap[b.code] || { name: b.name, count: 0 };
        statsMap[b.code].count++;
      });
      for (const code in statsMap) {
        csv += `"${code}","${statsMap[code].name}",${statsMap[code].count}\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'bead-shopping-list.csv';
      link.click();
    });
  </script>
</body>
</html>
