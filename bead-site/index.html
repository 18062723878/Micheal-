<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micheal 的拼豆网 · 在线拼豆图纸生成器</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <style>
    .hero-section {
      text-align: center;
      padding: 50px 20px 30px;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-title {
      font-size: 38px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.3;
      margin-bottom: 16px;
    }
    .hero-subtitle {
      font-size: 17px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .home-showcase {
      max-width: 1280px;
      margin: 40px auto 60px;
      padding: 0 20px;
    }
    .home-showcase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .featured-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }
    .featured-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
    }
    .featured-preview {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f8fafc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .featured-preview canvas {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
    .featured-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero-section">
      <h1 class="hero-title">将每一张喜爱的图片<br>变成清晰可拼的拼豆图纸</h1>
      <p class="hero-subtitle">智能色号匹配、支持 Artkal/Perler 多品牌色板、一键导出带坐标标尺的高清图纸与采购清单。</p>
      <div class="hero-buttons">
        <a href="create.html" class="btn btn-primary" style="padding: 12px 28px; font-size: 16px; text-decoration: none;">开始自由创作</a>
        <a href="inspiration.html" class="btn" style="padding: 12px 28px; font-size: 16px; text-decoration: none;">浏览 50+ 精选图纸</a>
      </div>
    </section>

    <!-- 精选图纸展区 -->
    <section class="home-showcase">
      <div class="home-showcase-header">
        <div>
          <h2 style="font-size: 22px; color: #1e293b; margin: 0;">🔥 热门推荐图纸</h2>
          <p style="color: #64748b; font-size: 14px; margin: 4px 0 0 0;">点击即可直接载入创作工坊进行微调与导出。</p>
        </div>
        <a href="inspiration.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">查看全部 (50+) →</a>
      </div>

      <div class="featured-grid" id="featured-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';

    try { injectChrome('home'); } catch (e) { console.warn(e); }

    function drawCardCanvas(canvas, matrix) {
      const h = matrix.length;
      const w = matrix[0].length;
      const cellSize = 18;
      canvas.width = w * cellSize;
      canvas.height = h * cellSize;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const bead = matrix[y][x];
          if (!bead) continue;
          const cx = x * cellSize + cellSize / 2;
          const cy = y * cellSize + cellSize / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, cellSize * 0.44, 0, Math.PI * 2);
          ctx.fillStyle = bead.hex;
          ctx.fill();
        }
      }
    }

    const grid = document.getElementById('featured-grid');
    const featuredList = ALL_PATTERNS.slice(0, 8); // 首页展示前 8 款顶流热门图纸

    featuredList.forEach(p => {
      const card = document.createElement('div');
      card.className = 'featured-card';
      card.innerHTML = `
        <div class="featured-preview">
          <canvas id="home-cv-${p.id}"></canvas>
        </div>
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
          <strong style="color: #1e293b; font-size: 15px;">${p.title}</strong>
          <span style="font-size: 11px; padding: 2px 6px; background: #eff6ff; color: #2563eb; border-radius: 4px;">${p.tag}</span>
        </div>
        <a href="create.html?patternId=${encodeURIComponent(p.id)}" class="btn btn-primary featured-btn">
          用这张图创作 →
        </a>
      `;
      grid.appendChild(card);
      drawCardCanvas(card.querySelector(`#home-cv-${p.id}`), p.matrix);
    });
  </script>
</body>
</html>
