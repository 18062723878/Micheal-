  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';

    try { injectChrome('home'); } catch (e) { console.warn(e); }

    function drawCardCanvas(canvas, matrix) {
      const h = matrix.length;
      const w = matrix[0].length;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const canvasBg = isDark ? '#0f172a' : '#ffffff';
      const cellSize = 16;

      canvas.width = w * cellSize;
      canvas.height = h * cellSize;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = canvasBg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const bead = matrix[y][x];
          if (!bead) continue;
          const cx = x * cellSize + cellSize / 2;
          const cy = y * cellSize + cellSize / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, cellSize * 0.44, 0, Math.PI * 2);
          ctx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
          ctx.fill();
        }
      }
    }

    const grid = document.getElementById('featured-grid');
    const featuredList = ALL_PATTERNS.slice(0, 8);

    featuredList.forEach(p => {
      const card = document.createElement('div');
      card.className = 'featured-card';
      card.innerHTML = `
        <div class="featured-preview">
          <canvas id="home-cv-${p.id}"></canvas>
        </div>
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
          <span class="featured-title">${p.title}</span>
          <span class="featured-tag">${p.tag}</span>
        </div>
        <a href="create.html?patternId=${encodeURIComponent(p.id)}" class="btn btn-primary featured-btn">
          用这张图创作 →
        </a>
      `;
      grid.appendChild(card);
      drawCardCanvas(card.querySelector(`#home-cv-${p.id}`), p.matrix);
    });

    // 切换明暗主题后重画缩略图。
    // 缩略图是 canvas，背景色在「画的那一刻」就定死了，
    // 不重画的话，切到暗色模式后这 8 张图还是白底，很刺眼。
    window.addEventListener('site:themechange', () => {
      featuredList.forEach(p => {
        const cv = document.getElementById(`home-cv-${p.id}`);
        if (cv) drawCardCanvas(cv, p.matrix);
      });
    });
  </script>
