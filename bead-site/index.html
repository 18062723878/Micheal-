<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micheal 的拼豆网 · 在线拼豆图纸生成器</title>

  <meta name="description" content="上传任意图片，自动转成拼豆图纸，支持一键导出 PNG / PDF / CSV 与色号矩阵清单，免费在线使用，无需注册。" />
  <meta name="keywords" content="拼豆,拼豆图纸,拼豆图纸生成器,拼豆色号,Artkal,像素画,手工DIY" />
  <meta name="theme-color" content="#2563eb" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Micheal 的拼豆网 · 在线拼豆图纸生成器" />
  <meta property="og:description" content="上传任意图片，自动转成拼豆图纸，一键导出 PNG / PDF / CSV。" />
  <meta property="og:image" content="assets/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />

  <style>
    .hero-section {
      text-align: center;
      padding: 56px 20px 32px;
      max-width: 860px;
      margin: 0 auto;
    }
    .hero-title {
      font-size: 38px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
      margin: 0 0 16px 0;
      letter-spacing: -0.02em;
    }
    .hero-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin: 0 0 32px 0;
      line-height: 1.6;
    }
    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .btn-outline {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-outline:hover {
      border-color: var(--text-muted);
    }

    .home-showcase {
      max-width: 1280px;
      margin: 40px auto 64px;
      padding: 0 20px;
    }
    .home-showcase-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .home-showcase-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 4px 0;
    }
    .home-showcase-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }
    .header-more-link {
      color: var(--primary);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }
    .header-more-link:hover {
      text-decoration: underline;
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .featured-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .featured-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }
    .featured-preview {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .featured-preview canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .featured-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .featured-title {
      color: var(--text-main);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .featured-tag {
      font-size: 11px;
      padding: 2px 7px;
      background: var(--bg-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }
    .featured-btn {
      width: 100%;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      background: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      transition: all 0.15s ease;
    }
    .featured-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    @media (max-width: 768px) {
      .hero-section { padding: 40px 16px 20px; }
      .hero-title { font-size: 28px; }
      .hero-subtitle { font-size: 14px; margin-bottom: 24px; }
      .hero-buttons .btn { width: 100%; }
      .home-showcase { padding: 0 16px; margin: 24px auto 44px; }
      .home-showcase-header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .featured-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .featured-card { padding: 12px; }
      .featured-title { font-size: 13px; }
    }
    @media (max-width: 480px) {
      .featured-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero-section">
      <h1 class="hero-title">将喜爱的图片<br>转换为清晰的拼豆图纸</h1>
      <p class="hero-subtitle">智能匹配标准色卡，实时生成带标尺图纸与色号用量矩阵。</p>
      <div class="hero-buttons">
        <a href="create.html" class="btn btn-primary">开始自由创作</a>
        <a href="whiteboard.html" class="btn btn-outline">白板自由画板</a>
        <a href="inspiration.html" class="btn btn-outline">浏览精选图库</a>
        <a href="tutorial.html" class="btn btn-outline">查看制作教程</a>
      </div>
    </section>

    <section class="home-showcase">
      <div class="home-showcase-header">
        <div>
          <h2>热门精选图纸</h2>
          <p>精选标准尺寸图案，支持载入工坊自由微调与导出。</p>
        </div>
        <a href="inspiration.html" class="header-more-link">查看全部图库 &rarr;</a>
      </div>

      <div class="featured-grid" id="featured-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';

    try { injectChrome('home'); } catch (e) { console.warn(e); }

    function drawCardCanvas(canvas, matrix) {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const canvasBg = isDark ? '#0b1120' : '#ffffff';
      const gridDot = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.04)';

      const h = matrix.length;
      const w = matrix[0].length;

      const size = 240;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = canvasBg;
      ctx.fillRect(0, 0, size, size);

      const maxDim = Math.max(w, h, 20);
      const cellSize = Math.floor((size - 24) / maxDim);
      const offsetX = Math.floor((size - w * cellSize) / 2);
      const offsetY = Math.floor((size - h * cellSize) / 2);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const cx = offsetX + x * cellSize;
          const cy = offsetY + y * cellSize;

          ctx.strokeStyle = gridDot;
          ctx.lineWidth = 1;
          ctx.strokeRect(cx, cy, cellSize, cellSize);

          const bead = matrix[y][x];
          if (!bead) continue;

          const centerX = cx + cellSize / 2;
          const centerY = cy + cellSize / 2;
          const radius = cellSize * 0.44;

          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.fillStyle = bead.hex || `rgb(${bead.r},${bead.g},${bead.b})`;
          ctx.fill();

          ctx.lineWidth = 0.8;
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
          ctx.stroke();
        }
      }
    }

    const grid = document.getElementById('featured-grid');
    const featuredList = ALL_PATTERNS.slice(0, 8);

    function renderFeaturedCards() {
      grid.innerHTML = '';
      featuredList.forEach(p => {
        const card = document.createElement('div');
        card.className = 'featured-card';
        card.innerHTML = `
          <div class="featured-preview">
            <canvas id="home-cv-${p.id}"></canvas>
          </div>
          <div class="featured-meta-row">
            <span class="featured-title">${p.title}</span>
            <span class="featured-tag">${p.matrix[0].length}&times;${p.matrix.length}</span>
          </div>
          <a href="create.html?patternId=${encodeURIComponent(p.id)}" class="featured-btn">
            载入设计工坊
          </a>
        `;
        grid.appendChild(card);
        drawCardCanvas(card.querySelector(`#home-cv-${p.id}`), p.matrix);
      });
    }

    renderFeaturedCards();

    window.addEventListener('site:themechange', () => {
      featuredList.forEach(p => {
        const cv = document.getElementById(`home-cv-${p.id}`);
        if (cv) drawCardCanvas(cv, p.matrix);
      });
    });
  </script>
</body>
</html>
