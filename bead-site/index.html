<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micheal 的拼豆网 · 在线拼豆图纸生成器</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <style>
    .hero-section {
      text-align: center;
      padding: 48px 20px 24px;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-title {
      font-size: 38px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 16px;
    }
    .hero-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .home-showcase {
      max-width: 1280px;
      margin: 36px auto 60px;
      padding: 0 20px;
    }
    .home-showcase-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .home-showcase-header h2 {
      font-size: 24px;
      color: var(--text-main);
      margin: 0;
    }
    .home-showcase-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 6px 0 0 0;
    }
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .featured-card {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .featured-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 12px 28px rgba(0,0,0,0.15);
    }
    .featured-preview {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .featured-preview canvas {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
    .featured-title {
      color: var(--text-main);
      font-size: 15px;
      font-weight: 700;
    }
    .featured-tag {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(37, 99, 235, 0.12);
      color: var(--primary);
      border-radius: 6px;
      font-weight: 600;
    }
    .featured-btn {
      width: 100%;
      margin-top: 12px;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero-section">
      <h1 class="hero-title">将喜爱的图片<br>变成清晰可拼的拼豆图纸</h1>
      <p class="hero-subtitle">智能色号匹配 · 72色旗舰色板 · 一键导出 Ultra-HD 带标尺高清图纸与色号矩阵清单。</p>
      <div class="hero-buttons">
        <a href="create.html" class="btn btn-primary" style="padding: 12px 26px; font-size: 15px; text-decoration: none; font-weight: 700;">🎨 开始自由创作</a>
        <a href="inspiration.html" class="btn" style="padding: 12px 26px; font-size: 15px; text-decoration: none;">✨ 浏览潮流精选图纸库</a>
        <a href="tutorial.html" class="btn" style="padding: 12px 26px; font-size: 15px; text-decoration: none; border-color: var(--primary); color: var(--primary); font-weight: 700;">📖 拼豆详细教程</a>
      </div>
    </section>

    <!-- 精选推荐展区 -->
    <section class="home-showcase">
      <div class="home-showcase-header">
        <div>
          <h2>🔥 热门精选图纸 (网络爆款精选)</h2>
          <p>点击任意图纸即可直接载入创作工坊进行无级缩放微调与导出。</p>
        </div>
        <a href="inspiration.html" style="color: var(--primary); font-weight: 600; text-decoration: none; font-size: 14px;">查看全部图纸 →</a>
      </div>

      <div class="featured-grid" id="featured-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { injectChrome } from './assets/js/chrome.js';
    import { ALL_PATTERNS } from './assets/js/patterns-data.js';

    try { injectChrome('home'); } catch (e) { console.warn(e); }

    function drawCardCanvas(canvas, matrix) {
      const h = matrix.length;
      const w = matrix[0].length;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const canvasBg = isDark ? '#0f172a' : '#ffffff';
      const cellSize = 12;

      canvas.width = w * cellSize;
      canvas.height = h * cellSize;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = canvasBg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const bead = matrix[y][x];
          if (!bead) continue;
          const cx = x * cellSize + cellSize / 2;
          const cy = y * cellSize + cellSize / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, cellSize * 0.44, 0, Math.PI * 2);
          ctx.fillStyle = bead.hex;
          ctx.fill();
        }
      }
    }

    const grid = document.getElementById('featured-grid');
    const featuredList = ALL_PATTERNS.slice(0, 8);

    featuredList.forEach(p => {
      const card = document.createElement('div');
      card.className = 'featured-card';
      card.innerHTML = `
        <div class="featured-preview">
          <canvas id="home-cv-${p.id}"></canvas>
        </div>
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
          <span class="featured-title">${p.title}</span>
          <span class="featured-tag">${p.tag}</span>
        </div>
        <a href="create.html?patternId=${encodeURIComponent(p.id)}" class="btn btn-primary featured-btn">
          用这张图创作 →
        </a>
      `;
      grid.appendChild(card);
      drawCardCanvas(card.querySelector(`#home-cv-${p.id}`), p.matrix);
    });
  </script>
</body>
</html>
